<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif"><rect width="760" height="364" fill="#fcfcfb"/><text x="24" y="34" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold">같은 옵션 결제는 한 줄로 선다</text><text x="24" y="56" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">판매 수 줄 잠금을 쥔 채 예치금·상품을 부르므로, 뒤 결제는 앞 결제의 HTTP 시간만큼 기다려요</text><rect x="24" y="74" width="12" height="12" rx="2" fill="#cfcdc6"/><text x="42" y="84" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">잠금 기다림</text><rect x="138" y="74" width="12" height="12" rx="2" fill="#eb6834"/><text x="156" y="84" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">잠금 쥐고 예치금·상품 호출</text><text x="24" y="124" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">결제 1</text><rect x="150" y="110" width="102" height="20" rx="3" fill="#eb6834"/><text x="24" y="158" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">결제 2</text><rect x="150" y="144" width="102" height="20" rx="3" fill="#cfcdc6"/><rect x="254" y="144" width="102" height="20" rx="3" fill="#eb6834"/><text x="24" y="192" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">결제 3</text><rect x="150" y="178" width="206" height="20" rx="3" fill="#cfcdc6"/><rect x="358" y="178" width="102" height="20" rx="3" fill="#eb6834"/><text x="24" y="226" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">결제 4</text><rect x="150" y="212" width="310" height="20" rx="3" fill="#cfcdc6"/><rect x="462" y="212" width="102" height="20" rx="3" fill="#eb6834"/><text x="24" y="260" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">결제 5</text><rect x="150" y="246" width="414" height="20" rx="3" fill="#cfcdc6"/><rect x="566" y="246" width="102" height="20" rx="3" fill="#eb6834"/><line x1="150" y1="278" x2="670" y2="278" stroke="#52514e"/><text x="150" y="296" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">0</text><text x="670" y="296" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">시간 →</text><text x="24" y="326" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">다섯째 결제는 앞 네 건의 호출 시간을 모두 기다려요. 연결 10개를 기다리는 결제가 다 쥐면, 다른 옵션 결제도 연결을 못 받아요.</text><text x="24" y="346" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">옵션 하나가 1초에 처리하는 결제 ≈ 1초 ÷ 잠금을 쥐는 시간. 0.1초면 초당 약 10건, 0.3초면 약 3건.</text></svg>