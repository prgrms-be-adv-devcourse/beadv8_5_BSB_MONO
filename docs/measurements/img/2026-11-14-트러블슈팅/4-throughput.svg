<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif"><rect width="760" height="306" fill="#fcfcfb"/><text x="24" y="34" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold">초당 처리한 결제 (들어온 결제는 초당 20건)</text><text x="24" y="56" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">2분 동안 처리한 결제 수 ÷ 120초</text><text x="24" y="98" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">나뉨, 지연 없음</text><rect x="150" y="84" width="436.3636363636363" height="20" rx="3" fill="#2a78d6"/><text x="594.3636363636363" y="99" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">20.0건</text><text x="24" y="132" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">나뉨, 0.1초</text><rect x="150" y="118" width="436.5454545454545" height="20" rx="3" fill="#2a78d6"/><text x="594.5454545454545" y="133" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">20.0건</text><text x="24" y="166" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">나뉨, 0.3초</text><rect x="150" y="152" width="379.8181818181818" height="20" rx="3" fill="#2a78d6"/><text x="537.8181818181818" y="167" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">17.4건</text><text x="24" y="200" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">몰림, 0.1초</text><rect x="150" y="186" width="251.09090909090907" height="20" rx="3" fill="#eb6834"/><text x="409.09090909090907" y="201" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">11.5건</text><text x="24" y="234" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">몰림, 0.3초</text><rect x="150" y="220" width="88.72727272727272" height="20" rx="3" fill="#eb6834"/><text x="246.72727272727272" y="235" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">4.1건</text><line x1="586.3636363636363" y1="74" x2="586.3636363636363" y2="250" stroke="#d03b3b" stroke-dasharray="4 3"/><text x="586.3636363636363" y="266" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="normal">들어온 결제 20건/초</text><text x="24" y="290" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">몰림에서 처리하지 못한 사람은 부하 도구가 들여보내지 못하고 건너뛰었어요(0.1초 898명, 0.3초 1,612명).</text></svg>