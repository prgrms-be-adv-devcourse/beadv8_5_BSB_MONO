<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif"><rect width="760" height="420" fill="#fcfcfb"/><text x="24" y="34" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold">예치금이 느려질 때 결제 p95 (#480 적용 뒤)</text><text x="24" y="56" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">초당 20명이 결제. 옵션 5개로 나뉠 때와 한 옵션으로 몰릴 때</text><rect x="24" y="74" width="12" height="12" rx="2" fill="#2a78d6"/><text x="42" y="84" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">옵션 5개로 나뉨</text><rect x="174" y="74" width="12" height="12" rx="2" fill="#eb6834"/><text x="192" y="84" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">한 옵션으로 몰림</text><line x1="70" y1="330.0" x2="730" y2="330.0" stroke="#e4e3df"/><text x="62" y="334.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">0초</text><line x1="70" y1="256.6666666666667" x2="730" y2="256.6666666666667" stroke="#e4e3df"/><text x="62" y="260.6666666666667" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">15초</text><line x1="70" y1="183.33333333333334" x2="730" y2="183.33333333333334" stroke="#e4e3df"/><text x="62" y="187.33333333333334" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">30초</text><line x1="70" y1="110.0" x2="730" y2="110.0" stroke="#e4e3df"/><text x="62" y="114.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">45초</text><rect x="128.0" y="328" width="48" height="2" rx="3" fill="#2a78d6"/><text x="152.0" y="322" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">0.2초</text><text x="208.0" y="322" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">안 잼</text><text x="180.0" y="350" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">예치금 지연 없음</text><rect x="348.0" y="328" width="48" height="2" rx="3" fill="#2a78d6"/><text x="372.0" y="322" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">0.1초</text><rect x="404.0" y="258.0502222222222" width="48" height="71.94977777777778" rx="3" fill="#eb6834"/><text x="428.0" y="252.0502222222222" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">14.7초</text><text x="400.0" y="350" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">예치금 지연 0.1초</text><rect x="568.0" y="286.0831111111111" width="48" height="43.91688888888889" rx="3" fill="#2a78d6"/><text x="592.0" y="280.0831111111111" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">9.0초</text><rect x="624.0" y="112.85511111111111" width="48" height="217.1448888888889" rx="3" fill="#eb6834"/><text x="648.0" y="106.85511111111111" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">44.4초</text><text x="620.0" y="350" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">예치금 지연 0.3초</text><text x="24" y="368" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">실제 예치금 처리 시간은 p50 2~4ms, p95 3~31ms (같은 docker 네트워크 안, 배포 직후 p95 0.7초).</text><text x="24" y="386" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">판매 수 줄 잠금 대기 평균: 몰림 0.1초 약 1초, 몰림 0.3초 약 2.7초, 나뉨 0.3초 0.37초, 나머지 1ms 아래.</text><text x="24" y="404" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">지연은 측정 도구로 넣은 값이에요. 반복 3회 중앙값.</text></svg>