<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 팀 비교 리포트 고정 틀. 내용은 아래 DATA만 바꾼다. 레이아웃: 왼쪽 사이드바 + 오른쪽 본문, 폰 폭에서는 위쪽 가로 탭 */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1b1f27; --muted: #626a78; --line: #e0e3ea;
  --accent: #2456d6; --accent-bg: #eaf0ff;
  --good: #1c7a46; --good-bg: #e8f6ee; --ok: #5a6170; --ok-bg: #eef0f3;
  --bad: #b4410f; --bad-bg: #fff1e8; --none: #9b1c2e; --none-bg: #fdecef;
  --sans: "Noto Sans KR", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111419; --surface: #1a1e26; --fg: #e6e9ef; --muted: #9aa3b2; --line: #2b313e;
  --accent: #82a5ff; --accent-bg: #1e2a47; --good: #63d69a; --good-bg: #163021; --ok: #b3bac6; --ok-bg: #252a34;
  --bad: #ff9d68; --bad-bg: #38221a; --none: #ff8a9b; --none-bg: #3a1a22; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111419; --surface: #1a1e26; --fg: #e6e9ef; --muted: #9aa3b2; --line: #2b313e;
  --accent: #82a5ff; --accent-bg: #1e2a47; --good: #63d69a; --good-bg: #163021; --ok: #b3bac6; --ok-bg: #252a34;
  --bad: #ff9d68; --bad-bg: #38221a; --none: #ff8a9b; --none-bg: #3a1a22; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }

nav { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { padding: 0 12px 16px; }
.brand b { display: block; font-size: 16px; line-height: 1.4; }
.brand span { font-size: 12px; color: var(--muted); }
.group { font-size: 11px; color: var(--muted); letter-spacing: .06em; padding: 16px 12px 6px; }
nav a { white-space: nowrap; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; color: var(--fg); text-decoration: none; font-size: 14px; }
nav a:hover { background: var(--bg); }
nav a.on { background: var(--accent-bg); color: var(--accent); font-weight: 700; }
nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { max-width: 980px; margin: 0 auto; display: grid; gap: 24px; }

.sub { color: var(--muted); margin: 6px 0 0; font-size: 14px; }

code { font-family: var(--mono); font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
b, strong { font-weight: 700; }

.lead { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 6px; }
.lead p { margin: 0; }
.lead strong { color: var(--accent); }

.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }

th, td { text-align: left; vertical-align: top; padding: 14px 16px; border-bottom: 1px solid var(--line); }

table.wide { min-width: 760px; }
td.name { white-space: nowrap; }
td.name a { color: var(--fg); font-weight: 700; text-decoration: none; }
td.name a:hover { color: var(--accent); }

table.matrix { min-width: 640px; font-size: 13px; }

ul.pts { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }

.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

.grade.good { background: var(--good-bg); color: var(--good); }

.legend { display: flex; flex-wrap: wrap; gap: 8px; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 0; }

.checks { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }

.size.s { background: var(--good-bg); color: var(--good); }

@media (max-width: 760px) { .ab-row { grid-template-columns: minmax(0, 1fr); } .ab-arrow { transform: rotate(90deg); } }

/* 점수판 (rubric이 있을 때만 쓰임) */

table.score { font-size: 13px; margin-top: 12px; }
table.score th, table.score td { padding: 7px 8px; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.good { color: var(--good); font-weight: 500; } td.weak { color: var(--bad); font-weight: 500; }
.radar { width: 100%; height: auto; display: block; }
.radar text { font-size: 11px; fill: var(--muted); }
.key { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--muted); }
.key span::before { content: ""; display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 4px; background: var(--accent-bg); color: var(--accent); }
.axis { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 16px; padding: 16px 20px; border-top: 1px solid var(--line); }

.axis h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

ul.ck li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 4px; }
ul.ck li.y > b { color: var(--good); } ul.ck li.n > b { color: var(--bad); }
ul.ck small { display: block; color: var(--muted); font-family: var(--mono); font-size: 11px; }
ul.ck small.def { color: var(--none); font-family: var(--sans); }
.capline { color: var(--none); font-size: 13px; margin: 8px 0 0; }
.capline { display: flex; align-items: center; gap: 6px; }
.tip { position: relative; display: inline-flex; }
.tip-btn { width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 1px solid var(--none); background: var(--none-bg); color: var(--none); font: 700 11px/1 var(--sans); cursor: help; }
.tip-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tip-body { display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: min(460px, 80vw); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.6; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); overflow-wrap: anywhere; }
.tip-title { display: block; font-weight: 700; color: var(--none); margin-bottom: 4px; }
.tip-head { display: block; font-size: 13px; margin-bottom: 8px; }
ul.tip-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
ul.tip-list li { display: grid; gap: 3px; }
ul.tip-list b { font-size: 12px; }
ul.tip-list code { justify-self: start; font-size: 11px; overflow-wrap: anywhere; }
.tip:hover .tip-body, .tip:focus-within .tip-body { display: block; }
.dist { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; height: 96px; width: 180px; margin: 0 auto; }
.axis > div + div { align-self: end; } /* 체크리스트 상자와 높이를 맞춘다 */
.axis.solo { grid-template-columns: minmax(0, 1fr); }
.dist div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dist i { width: 18px; background: var(--line); border-radius: 4px 4px 0 0; min-height: 2px; }
.dist .me { color: var(--accent); font-weight: 700; } .dist .me i { background: var(--accent); }
.dist-cap { font-size: 11px; color: var(--muted); text-align: center; margin: 6px 0 0; }
table.rank-tbl { min-width: 760px; font-size: 13px; }
table.rank-tbl th, table.rank-tbl td { padding: 10px 8px; text-align: center; }
table.rank-tbl th:nth-child(2), table.rank-tbl td:nth-child(2) { text-align: left; }
table.rank-tbl th small { display: block; font-weight: 400; }
.mini { display: inline-block; width: 56px; height: 6px; background: var(--bg); border-radius: 3px; vertical-align: middle; margin-left: 6px; }
.mini i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.dec { display: grid; gap: 6px; padding: 14px 18px; border-top: 1px solid var(--line); }
.dec:first-child { border-top: 0; }
.dec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pick { font-size: 13px; font-weight: 700; color: var(--accent); }
.dec-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.lbl { font-size: 12px; color: var(--muted); padding-top: 2px; }
.opts { display: flex; flex-wrap: wrap; gap: 4px; }
.opt { font-size: 12px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.nil { color: var(--muted); font-size: 13px; }
small.src { color: var(--muted); font-size: 12px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.vs { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.vs i { font-style: normal; font-size: 12px; color: var(--muted); }
.flow .opt { font-size: 13px; padding: 3px 10px; }
.arrow { color: var(--muted); }
.won { font-size: 15px; font-weight: 700; color: var(--accent); background: var(--accent-bg); padding: 3px 12px; border-radius: 6px; }
ol.items { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  nav { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; display: flex; gap: 4px; overflow-x: auto; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .brand, .group { display: none; }
  nav a { white-space: nowrap; flex: none; }
  nav a small { display: none; }
  main { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 24px; }
  .check { grid-template-columns: minmax(0, 1fr) auto; }
  .check p { grid-column: 1 / -1; }

<div class="app">
  <nav id="nav" aria-label="페이지 목록"></nav>
  <main id="main"></main>
</div>

<script>
// 내용은 이 한 줄만 바꾼다. 형식은 data-schema.md
const DATA = /*DATA*/null;

const GRADES = { good: "잘함", ok: "보통", weak: "아쉬움", none: "없음", unknown: "확인 못 함" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 글 안의 **굵게**와 `코드`만 허용한다. 나머지는 모두 글자로 이스케이프한다
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const list = (arr, cls = "") => `<ul class="pts ${cls}">${(arr || []).map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
const LABEL = { ...GRADES, na: "해당 없음" };
const grade = g => `<span class="grade ${g === "na" ? "unknown" : esc(g)}">${LABEL[g] ?? esc(g)}</span>`;
const teamLabel = t => `${t.no}팀 ${t.name}`;
const header = (title, sub) => `<header><h1>${esc(title)}</h1>${sub ? `<p class="sub">${md(sub)}</p>` : ""}</header>`;
const lead = lines => lines?.length ? `<div class="lead">${lines.map(l => `<p>${md(l)}</p>`).join("")}</div>` : "";
const teamById = id => DATA.teams.find(t => t.id === id);

// 점수 계산. 축 점수 = 충족 개수(0~4), 상한이 걸리면 최대 1. 해당 없는 축은 빼고 남은 가중치로 100점 환산
const R = DATA.rubric;
const fmt = n => String(+n.toFixed(2));
const axisPts = s => !s || s.na ? null : (n => s.cap ? Math.min(n, 1) : n)(s.items.filter(i => i.ok).length);
const axisGrade = (p, s) => p === null ? "na" : s.cap || p <= 1 ? "weak" : p === 4 ? "good" : "ok";
const SC = {};
DATA.teams.forEach(t => {
  let got = 0, w = 0;
  const axes = R.axes.map(a => {
    const s = t.scores[a.id], p = axisPts(s);
    if (p !== null) { got += p / 4 * a.weight; w += a.weight; }
    return { a, s, p, pts: p === null ? null : p / 4 * a.weight, g: axisGrade(p, s) };
  });
  SC[t.id] = { axes, total: w ? Math.round(got / w * 1000) / 10 : 0 };
});
DATA.teams.forEach(t => SC[t.id].rank = 1 + DATA.teams.filter(u => SC[u.id].total > SC[t.id].total).length);
const AVG = DATA.teams.reduce((s, t) => s + SC[t.id].total, 0) / DATA.teams.length;
const axisVals = i => DATA.teams.map(t => SC[t.id].axes[i].p).filter(p => p !== null);
const AXIS_AVG = R.axes.map((_, i) => { const v = axisVals(i); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : 0; });
const N = DATA.teams.length;

function radar(t) {
  const n = R.axes.length, c = 150, r = 90;
  const pt = (i, v) => { const g = -Math.PI / 2 + 2 * Math.PI * i / n; return [c + Math.cos(g) * r * v / 4, c + Math.sin(g) * r * v / 4]; };
  const poly = vals => vals.map((v, i) => pt(i, v ?? 0).map(x => x.toFixed(1)).join(",")).join(" ");
  const rings = [1, 2, 3, 4].map(k => `<polygon points="${poly(Array(n).fill(k))}" fill="none" stroke="var(--line)"/>`).join("");
  const spokes = R.axes.map((_, i) => { const [x, y] = pt(i, 4); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join("");
  const labels = R.axes.map((a, i) => { const [x, y] = pt(i, 4.6);
    return `<text x="${x}" y="${y}" text-anchor="${Math.abs(x - c) < 8 ? "middle" : x > c ? "start" : "end"}" dominant-baseline="middle">${esc(a.short || a.name)}</text>`; }).join("");
  return `<svg class="radar" viewBox="0 0 300 300" role="img" aria-label="${esc(teamLabel(t))}와 ${N}팀 평균의 축별 점수">${rings}${spokes}
    <polygon points="${poly(AXIS_AVG)}" fill="none" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1.5"/>
    <polygon points="${poly(SC[t.id].axes.map(x => x.p))}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2"/>${labels}</svg>
    <div class="key"><span>이 팀</span><span class="avg">${N}팀 평균</span></div>`;
}

function dist(i, p) {
  if (N < 2) return ""; // 팀이 하나면 분포가 뜻이 없다
  const v = axisVals(i), cnt = [0, 1, 2, 3, 4].map(k => v.filter(x => x === k).length), max = Math.max(...cnt, 1);
  return `<div><div class="dist">${cnt.map((n, k) => `<div class="${k === p ? "me" : ""}"><span>${n}팀</span><i style="height:${n / max * 56}px"></i><span>${k}/4</span></div>`).join("")}</div>
    <p class="dist-cap">${v.length}팀의 이 축 점수 분포</p></div>`;
}

// 치명 결함 문장을 「요약 한 줄 + 무엇이 · 어디에」 목록으로 나눈다. 경로는 서비스 · 파일:줄로 줄인다
const PATH = /(?:[\w.-]+\/)*[\w.-]+\.(?:java|kt|kts|ya?ml|properties|pem|json|sql|md|ts)(?::[\d][\d·,-]*)?/g;
const SKIP = ["backend", "services", "apps", "src", "main", "java", "resources", "com", "test"];
function shortPath(p) {
  const parts = p.split("/"), file = parts.pop();
  const mod = parts.find(x => /-(service|app)$|^gateway$|^monolith$/.test(x)) || parts.find(x => !SKIP.includes(x)) || "";
  return mod ? `${mod} · ${file}` : file;
}
function capView(text) {
  let head = "", label = "";
  const groups = new Map();
  String(text).split(/;\s*/).forEach((seg, i) => {
    const paths = seg.match(PATH) || [];
    let rest = seg.replace(PATH, " ").replace(/\s+/g, " ").trim();
    // 첫 조각은 「요약: 목록」이나 「요약 (목록」 모양이다
    const c = rest.indexOf(": "), o = rest.indexOf(" (");
    if (i === 0 && c > 0) { head = rest.slice(0, c); rest = rest.slice(c + 2); }
    else if (i === 0 && o > 0 && paths.length) { head = rest.slice(0, o); rest = rest.slice(o + 2); }
    else if (!head && rest.length > 24) { head = rest; rest = ""; }
    rest = rest.replace(/[()]/g, " ").replace(/^[\s,·.:]+|[\s,·.:]+$/g, "").trim();
    if (rest) label = rest;
    if (paths.length) groups.set(label, [...(groups.get(label) || []), ...paths.map(shortPath)]);
  });
  head = head.replace(/[\s:]+$/, "");
  const rows = [...groups].map(([l, ps]) => `<li>${l ? `<b>${esc(l)}</b>` : ""}${ps.map(x => `<code>${esc(x)}</code>`).join("")}</li>`).join("");
  return `<span class="tip-title">치명 결함</span>${head ? `<span class="tip-head">${esc(head)}</span>` : ""}${rows ? `<ul class="tip-list">${rows}</ul>` : ""}`;
}

function axisDetail(x, i) {
  const { a, s, p, pts, g } = x;
  if (p === null) return `<div class="axis"><div><h3>${esc(a.name)} ${grade("na")}</h3><p class="meta">${md(s.why || "")}</p></div></div>`;
  const met = s.items.filter(it => it.ok).length;
  return `<div class="axis ${N < 2 ? "solo" : ""}"><div>
    <h3>${esc(a.name)} ${grade(g)}</h3>
    <p class="meta">확인 항목 ${met}/4 충족${s.cap ? " → 치명 결함으로 최대 1/4" : ""} · ${fmt(pts)}/${a.weight}점</p>
    <ul class="ck">${a.items.map((it, k) => { const r = s.items[k];
      return `<li class="${r.ok ? "y" : "n"}"><b>${r.ok ? "✓" : "✗"}</b><span>${md(it)}${r.defect ? `<small class="def">결함: ${esc(r.defect)}</small>` : ""}${r.via === "변호" ? `<small class="src">변호 단계에서 충족으로 확인</small>` : ""}</span></li>`; }).join("")}</ul>
    ${s.cap ? `<div class="capline"><span class="tip"><button type="button" class="tip-btn" aria-label="치명 결함 내용 보기">!</button><div class="tip-body" role="tooltip">${capView(s.cap)}</div></span>치명 결함 · 이 축은 최대 1점</div>` : ""}
  </div>${dist(i, p)}</div>`;
}

function scoreboard(t) {
  const S = SC[t.id], strong = S.axes.filter(x => x.g === "good");
  return `<section class="score-top">
      <div class="card"><span class="rank">${N}팀 중 ${S.rank}위 · ${S.total}점</span>
        <div class="bar"><i style="width:${S.total}%"></i><u style="left:${AVG}%"></u></div>
        <div class="bar-scale"><span>0</span><span>세로선은 ${N}팀 평균 ${AVG.toFixed(1)}점</span><span>100</span></div>
        <table class="score"><thead><tr><th>축</th><th>점수</th><th>판정</th></tr></thead><tbody>
        ${S.axes.map(x => `<tr><td>${esc(x.a.name)}</td><td class="num">${x.p === null ? "–" : `${fmt(x.pts)}/${x.a.weight}`}</td><td>${grade(x.g)}${x.s?.cap ? " <small>치명 결함</small>" : ""}</td></tr>`).join("")}
        </tbody></table></div>
      <div class="card">${radar(t)}</div>
    </section>
    ${strong.length ? `<section><h2>강점</h2><div class="chips">${strong.map(x => `<span class="chip">${esc(x.a.name)}</span>`).join("")}</div></section>` : ""}
    <section><h2>축별 상세</h2><div class="checks">${S.axes.map(axisDetail).join("")}</div></section>`;
}

function scores() {
  const sorted = [...DATA.teams].sort((x, y) => SC[x.id].rank - SC[y.id].rank);
  return `<div class="page">
    ${header("점수 순위", R.note)}
    ${lead(R.summary)}
    <div class="tbl"><table class="rank-tbl">
      <thead><tr><th>순위</th><th>팀</th><th>총점</th>${R.axes.map(a => `<th>${esc(a.short || a.name)}<small>${a.weight}점</small></th>`).join("")}</tr></thead>
      <tbody>${sorted.map(t => { const S = SC[t.id]; return `<tr class="${t.ours ? "ours" : ""}">
        <td class="num">${S.rank}</td><td class="name"><a href="#${esc(t.id)}">${esc(teamLabel(t))}</a></td>
        <td class="num">${S.total}<span class="mini"><i style="width:${S.total}%"></i></span></td>
        ${S.axes.map(x => `<td class="num ${x.g}">${x.p === null ? "–" : x.p + (x.s.cap ? "*" : "")}</td>`).join("")}</tr>`; }).join("")}
        <tr><td></td><td>${N}팀 평균</td><td class="num">${AVG.toFixed(1)}</td>${AXIS_AVG.map(v => `<td class="num">${v.toFixed(1)}</td>`).join("")}</tr>
      </tbody></table></div>
    <p class="foot">축 칸은 확인 항목 충족 개수(0~4)입니다. *는 치명 결함이 있어 최대 1점만 받는 축, –는 해당 없는 축입니다.</p>
  </div>`;
}

function rubric() {
  return `<div class="page">
    ${header("채점 기준", "축마다 확인 항목 4개 · 근거 파일:줄이 있어야 충족")}
    ${lead(R.rules)}
    ${R.axes.map((a, i) => `<section class="card"><h2>${i + 1}. ${esc(a.name)} <small>${a.weight}점</small></h2>
      <ol class="items">${a.items.map(it => `<li>${md(it)}</li>`).join("")}</ol>
      ${a.cap ? `<p class="capline">치명 결함: ${md(a.cap)}</p>` : ""}</section>`).join("")}
    ${R.rulings?.length ? `<section><h2>판정 사례</h2><div class="checks">${R.rulings.map(x => `<div class="check"><span class="item">${esc(x.id)} · ${esc(x.target)}</span><span></span><p>${md(x.rule)}${x.example ? `<br><small class="src">예: ${esc(x.example)}</small>` : ""}</p></div>`).join("")}</div></section>` : ""}
  </div>`;
}

function overview() {
  return `<div class="page">
    ${header("한눈에 보기", DATA.subtitle)}
    ${lead(DATA.summary)}
    <div class="tbl"><table class="wide">
      <thead><tr><th style="width:190px">팀</th>${DATA.kindLabel ? `<th style="width:130px">${esc(DATA.kindLabel)}</th>` : ""}<th>잘한 점</th><th>아쉬운 점</th></tr></thead>
      <tbody>${DATA.teams.map(t => `<tr class="${t.ours ? "ours" : ""}">
        <td class="name"><a href="#${esc(t.id)}">${esc(teamLabel(t))}</a><span>${esc(t.product)}</span></td>
        ${DATA.kindLabel ? `<td><span class="tag">${esc(t.kind)}</span></td>` : ""}
        <td>${list(t.good.slice(0, 2), "g")}</td>
        <td>${list(t.bad.slice(0, 2), "b")}</td></tr>`).join("")}
      </tbody></table></div>
    <p class="foot">표에는 팀마다 핵심 두 개만 넣었습니다. 팀 이름을 누르면 상세 페이지로 갑니다.</p>
    ${DATA.footer ? `<p class="foot">${md(DATA.footer)}</p>` : ""}
  </div>`;
}

function matrix() {
  const legend = `<div class="legend">${Object.keys(GRADES).map(grade).join("")}</div>`;
  return `<div class="page">
    ${header("항목별 판정", DATA.matrix.note)}
    ${legend}
    ${DATA.matrix.sections.map(s => {
      const cols = s.teams.map(teamById).filter(Boolean);
      return `<section><h2>${esc(s.title)}</h2><div class="tbl"><table class="matrix">
        <thead><tr><th>항목</th>${cols.map(t => `<th class="${t.ours ? "ours" : ""}">${t.no}${t.ours ? " 우리" : ""}</th>`).join("")}</tr></thead>
        <tbody>${s.rows.map(r => `<tr><td>${md(r.item)}</td>${r.grades.map((g, i) => `<td class="${cols[i]?.ours ? "ours" : ""}">${grade(g)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>${s.note ? `<p class="foot" style="margin-top:8px">${md(s.note)}</p>` : ""}</section>`;
    }).join("")}
  </div>`;
}

function team(t) {
  const checks = t.checks?.length ? `<section><h2>항목별 판정</h2><div class="checks">${t.checks.map(c =>
    `<div class="check"><span class="item">${md(c.item)}</span>${grade(c.grade)}<p>${md(c.text)}</p></div>`).join("")}</div></section>` : "";
  return `<div class="page">
    ${header(teamLabel(t), [t.product, t.kind, t.source].filter(Boolean).join(" · "))}
    ${scoreboard(t)}
    <dl class="facts">${(t.facts || []).map(([k, v]) => `<div class="fact"><dt>${esc(k)}</dt><dd>${md(v)}</dd></div>`).join("")}</dl>
    <div class="two">
      <section class="box g"><h2>잘한 점</h2>${list(t.good, "g")}</section>
      <section class="box b"><h2>아쉬운 점</h2>${list(t.bad, "b")}</section>
    </div>
    ${checks}
    ${DATA.decisions ? `<section><h2>설계 선택</h2><div class="checks">${DATA.decisions.topics.map(tp => decCard(tp, t.decisions?.[tp.id])).join("")}</div></section>` : ""}
    ${t.ours ? `<div class="take"><b>다음 할 일</b><a href="#apply">우리 팀 적용안 보기 →</a></div>`
             : t.take?.length ? `<div class="take"><b>우리가 가져올 것</b>${list(t.take)}</div>` : ""}
  </div>`;
}

function apply() {
  let n = 0;
  return `<div class="page">
    ${header("우리 팀 적용안", "작고 급한 것부터 순서대로")}
    ${lead(DATA.apply.summary)}
    ${DATA.apply.groups.map(g => `${g.title ? `<p class="group-title">${esc(g.title)}</p>` : ""}<div class="steps">${g.items.map(a => `<div class="step ${a.urgent ? "urgent" : ""}">
      <div class="n">${++n}</div>
      <h3>${md(a.title)}${a.ref ? ` <small>· 참고 ${esc(a.ref)}</small>` : ""}</h3>
      ${a.badge ? `<span class="size ${esc(a.badge.level)}">${esc(a.badge.text)}</span>` : "<span></span>"}
      <p>${md(a.why)}</p></div>`).join("")}</div>`).join("")}
  </div>`;
}

function strengths() {
  const S = DATA.strengths;
  const card = r => `<div class="ab ${r.status === "have" ? "have" : ""}">
    <div class="ab-head"><h3>${md(r.title)} <small>· ${esc(r.ref)}</small></h3>${r.badge ? `<span class="size ${esc(r.badge.level)}">${esc(r.badge.text)}</span>` : ""}</div>
    ${r.status === "have"
      ? `<div class="ab-cell as"><b>우리도 있음</b>${md(r.asis)}</div>`
      : `<div class="ab-row"><div class="ab-cell as"><b>AS IS</b>${md(r.asis)}</div><div class="ab-arrow" aria-hidden="true">→</div><div class="ab-cell to"><b>TO BE</b>${md(r.tobe)}</div></div>`}
  </div>`;
  const todo = S.rows.filter(r => r.status !== "have"), have = S.rows.filter(r => r.status === "have");
  return `<div class="page">
    ${header("다른 팀 장점 적용", S.note)}
    ${lead(S.summary)}
    ${todo.length ? `<p class="group-title">가져올 것 ${todo.length}개</p><div class="steps">${todo.map(card).join("")}</div>` : ""}
    ${have.length ? `<p class="group-title">이미 갖춘 것 ${have.length}개</p><div class="steps">${have.map(card).join("")}</div>` : ""}
  </div>`;
}

// 설계 선택: 고민한 선택지 → 고른 것 → 이유. 기록이 없으면 지어내지 않고 「기록 없음」으로 보인다
const none = s => `<span class="nil">${s}</span>`;
const considered = d => d?.considered?.length
  ? `<span class="opts">${d.considered.map(o => `<span class="${o === d.choice ? "chip" : "opt"}">${esc(o)}</span>`).join("")}</span>`
  : none("기록 없음");
const reason = d => d?.why ? `${md(d.why)}${d.src ? ` <small class="src">${esc(d.src)}</small>` : ""}` : none("이유 기록 없음");
// 팀 상세: 고민한 선택지 vs … → ✔ 고른 것. 고민 기록이 없으면 고른 것만 보인다
function decCard(tp, d) {
  const others = (d?.considered || []).filter(o => o !== d?.choice);
  const pool = d?.choice && others.length ? [...others, d.choice] : [];
  const flow = !d?.choice ? none("확인 못 함")
    : `${pool.length ? `<span class="vs">${pool.map(o => `<span class="opt">${esc(o)}</span>`).join(`<i>vs</i>`)}</span><span class="arrow" aria-hidden="true">→</span>` : ""}<span class="won">✔ ${esc(d.choice)}</span>`;
  return `<div class="dec"><div class="dec-head"><b>${esc(tp.name)}</b></div>
    <div class="flow">${flow}</div>
    <div class="dec-row"><span class="lbl">이유</span><span>${reason(d)}</span></div></div>`;
}
function decisions() {
  const D = DATA.decisions;
  return `<div class="page">
    ${header("설계 선택", D.note)}
    ${lead(D.summary)}
    ${D.topics.map(tp => {
      const rows = DATA.teams.map(t => [t, t.decisions?.[tp.id]]);
      const tally = {};
      rows.forEach(([, d]) => { if (d?.choice) tally[d.choice] = (tally[d.choice] || 0) + 1; });
      return `<section><h2>${esc(tp.name)}</h2>
        <div class="opts" style="margin-bottom:10px">${(tp.options || []).concat(Object.keys(tally).filter(k => !(tp.options || []).includes(k)))
          .map(o => `<span class="${tally[o] ? "chip" : "opt"}">${esc(o)} · ${tally[o] || 0}팀</span>`).join("")}</div>
        <div class="tbl"><table class="wide"><thead><tr><th style="width:170px">팀</th><th style="width:140px">고른 것</th><th style="width:220px">고민한 선택지</th><th>이유</th></tr></thead>
        <tbody>${rows.map(([t, d]) => `<tr class="${t.ours ? "ours" : ""}"><td class="name"><a href="#${esc(t.id)}">${esc(teamLabel(t))}</a></td>
          <td>${d?.choice ? `<b>${esc(d.choice)}</b>` : none("확인 못 함")}</td><td>${considered(d)}</td><td>${reason(d)}</td></tr>`).join("")}</tbody></table></div></section>`;
    }).join("")}
  </div>`;
}

const ROUTES = { overview: overview, scores: scores, rubric: rubric, apply: apply };
if (DATA.decisions) ROUTES.decisions = decisions;
if (DATA.strengths) ROUTES.strengths = strengths;
if (DATA.matrix) ROUTES.matrix = matrix;
DATA.teams.forEach(t => ROUTES[t.id] = () => team(t));

document.getElementById("nav").innerHTML =
  `<div class="brand"><b>${esc(DATA.title)}</b><span>${esc(DATA.navCaption || "")}</span></div>
   <div class="group">기수 전체</div>
   <a href="#overview" data-r="overview">한눈에 보기</a>
   <a href="#scores" data-r="scores">점수 순위</a>
   <a href="#rubric" data-r="rubric">채점 기준</a>
   ${DATA.decisions ? `<a href="#decisions" data-r="decisions">설계 선택</a>` : ""}
   ${DATA.matrix ? `<a href="#matrix" data-r="matrix">항목별 판정</a>` : ""}
   <a href="#apply" data-r="apply">우리 팀 적용안</a>
   ${DATA.strengths ? `<a href="#strengths" data-r="strengths">다른 팀 장점 적용</a>` : ""}
   <div class="group">팀별 상세</div>
   ${DATA.teams.map(t => `<a href="#${esc(t.id)}" data-r="${esc(t.id)}">${esc(teamLabel(t))}<small>${SC[t.id].total}점</small></a>`).join("")}`;

function render() {
  const key = (location.hash || "").slice(1);
  const r = ROUTES[key] ? key : "overview";
  document.getElementById("main").innerHTML = ROUTES[r]();
  document.querySelectorAll("nav a[data-r]").forEach(a => a.classList.toggle("on", a.dataset.r === r));
  document.querySelector("nav a.on")?.scrollIntoView({ block: "nearest", inline: "nearest" });
  window.scrollTo(0, 0);
}
addEventListener("hashchange", render);
render();
</script>
