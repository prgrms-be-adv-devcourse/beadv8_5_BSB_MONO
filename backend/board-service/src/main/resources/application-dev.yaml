spring:
  # 지금은 다른 서비스와 같은 DB(bukang-db)를 쓰고, 테이블 이름 접두사(board_)로 구분한다
  datasource:
    url: jdbc:mysql://localhost:3306/bukang-db
    username: bukang2
    password: bukang2
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  kafka:
    bootstrap-servers:
      - localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

  # 글 검색 인덱스(board_posts). 대회 검색(product)과 같은 Elasticsearch를 쓰고 인덱스 이름만 다르다
  elasticsearch:
    uris: http://localhost:9200

board:
  clients:
    member:
      mode: fake
      base-url: http://localhost:8080

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug
