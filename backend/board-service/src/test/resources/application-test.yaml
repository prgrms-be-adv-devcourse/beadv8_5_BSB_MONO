# 테스트 전용 설정 (@ActiveProfiles("test")로 활성화)
spring:
  datasource:
    # MySQL 대신 H2 인메모리 DB, Flyway SQL로 표를 만들어 운영과 같은 표·제약으로 확인한다
    url: jdbc:h2:mem:bukang-board-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # 브로커 없이도 컨텍스트가 뜨도록 리스너 자동 시작을 끈다
      auto-startup: false

logging:
  level:
    com.bukang: debug

board:
  search:
    reindex:
      # 테스트에서는 기동 때 자동으로 채우지 않는다 (Elasticsearch가 없다)
      enabled: false
  clients:
    member:
      mode: fake
  member-backfill:
    # 테스트에서는 기동 때 자동으로 채우지 않는다 (필요한 테스트가 직접 켠다)
    enabled: false
    # 첫 호출 재시도 간격을 짧게 해 테스트가 오래 걸리지 않게 한다
    retry-interval: 10ms
