server:
  # 다른 서비스(member 8080 … board 8089)와 동시에 실행하므로 포트를 나눈다. 8090·8091은 compose의 관리 화면(Elasticvue, Kafka 콘솔)이 쓴다
  port: 8092

spring:
  application:
    name: ai-service

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  # 개발 실행(bootRun/IDE) 시 backend/compose.yml의 인프라를 자동으로 띄운다
  docker:
    compose:
      # 여러 서비스가 같은 인프라를 함께 쓰므로, 한 서비스를 종료해도 컨테이너는 멈추지 않는다
      lifecycle-management: start-only

  ai:
    # 어느 회사 모델을 쓸지. 서버(기본)는 openai, 로컬(dev)·테스트는 ollama로 프로파일 yaml이 바꾼다
    # 코드는 ChatClient만 쓰므로 모델을 바꿔도 코드를 고치지 않는다
    # 글을 쓰는 모델(chat)만 쓴다. 나머지를 끄지 않으면 openai·ollama 스타터가 임베딩·이미지·음성 모델 빈까지 만든다
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # 모델 호출이 실패했을 때 다시 시도하는 횟수 (Ollama 등 Spring의 재시도를 쓰는 모델). 추천값(미확정)
    # 기본값(10번, 2초부터 5배씩)이면 모델이 꺼져 있을 때 요청 하나가 몇 분씩 붙잡힌다
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
    # 한 질문에서 도구를 부르는 횟수 상한. 추천값(미확정). 넘으면 도구를 더 부르지 않고 503(AI_MODEL_UNAVAILABLE)으로 답한다 (AiChatUseCase)
    # 모델 호출은 도구 호출 묶음마다 한 번씩 더 나가므로, 한 질문의 모델 호출도 최대 (도구 호출 상한 + 1)번이다
    # 모델이 느리면 그 전에 게이트웨이(60초)가 먼저 끊을 수 있다
    tools:
      limits:
        max-total-tool-calls: 4
        max-calls-per-tool-default: 2
    openai:
      # 게이트웨이가 60초에 끊으므로 그 안에 끝나게 한다: 한 번에 25초, 다시 시도 1번. 추천값(미확정)
      timeout: 25s
      max-retries: 1
      # 키는 backend/.env의 OPENAI_API_KEY로만 받는다. 비어 있어도 앱은 뜨고, 질문하면 503(AI_MODEL_UNAVAILABLE)으로 답한다
      api-key: ${OPENAI_API_KEY:}
      chat:
        # 추천값(미확정): Spring AI 2.0.2의 기본 모델
        model: gpt-5-mini
    chat:
      memory:
        repository:
          # 대화 기록은 Redis에 둔다 (DB 표 없음). Redis의 검색·JSON 기능을 쓰므로 Redis 8 이상이어야 한다 (compose는 redis:8.2)
          # 앱이 뜰 때 검색 인덱스를 만들므로 Redis가 꺼져 있으면 앱이 뜨지 않는다. 접속 주소(host, port)는 프로파일별 yaml에 있다
          redis:
            # 키: ai:chats:{화면}-{회원 번호}:{순번} (메시지 하나가 키 하나), 순번을 매기는 키는 ai:chats:counter:{화면}-{회원 번호}
            key-prefix: "ai:chats:"
            # 인덱스 모양을 바꾸면 이름도 바꾼다. 이미 있는 이름이면 새 모양으로 다시 만들지 않는다 (v2: metadata-fields를 넣음)
            index-name: ai-chats-v2-idx
            # 메타데이터에서 인덱스에 넣을 칸을 정해 둔다. 비워 두면 메타데이터 전체를 글자로 인덱스에 넣는데,
            # OpenAI 답에는 숫자·목록 메타데이터(index, annotations)가 있어 인덱스에 들어가지 못한다
            # → 그 답은 조회·지우기에서 빠져, 모델이 앞 대화의 답을 보지 못하고 「새 대화」로도 지워지지 않는다
            metadata-fields:
              - name: messageType
                type: tag
            # 보관 시간. 추천값(미확정): 마지막으로 쓴 뒤 하루가 지난 메시지는 Redis가 지운다
            time-to-live: 24h

# Swagger / OpenAPI V3 설정 (prod에서는 비활성화)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  open-api:
    info:
      title: Bukang AI API
      description: 크루 중심 마라톤 대회 예매·커머스 플랫폼 크루런 AI API
      version: v1

ai:
  chat:
    # 대화 기록에 남기는 최근 메시지 수(질문·답을 따로 셈). 모델에는 이 기록과 새 질문이 간다. 추천값(미확정). 넘으면 오래된 것부터 대화 기록에서도 지운다
    max-messages: 10
  # 다른 서비스 호출. mode가 http면 실제 내부 API(/internal/v1/...)를, fake면 가짜 어댑터를 쓴다
  # mode는 프로파일별 yaml에 꼭 적는다. 빠지면 가짜로 열리지 않고 앱이 뜨지 않는다 (누구나 관리자가 되지 않게)
  clients:
    # 연결·응답 시간 제한. 넘으면 503으로 다시 시도하게 한다 (도구는 실패로 보고 화면에서 확인하라고 안내한다)
    timeout: 2s
    # 도구가 부르는 서비스 주소 (게이트웨이를 거치지 않는다). 가짜 모드는 없다. prod는 application-prod.yaml이 컨테이너 이름으로 바꾼다
    member:
      base-url: http://localhost:8080
    payout:
      base-url: http://localhost:8082
    order:
      base-url: http://localhost:8084
    inquiry:
      base-url: http://localhost:8088
