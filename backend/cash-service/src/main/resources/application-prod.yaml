spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

  # 표 변경은 Flyway SQL(db/migration)로만 한다
  # 모든 서비스가 같은 스키마를 쓰므로, 기록 표는 cash 전용 이름으로 둔다 (다른 서비스의 flyway_schema_history_*와 섞이지 않게)
  # 기준선을 0번으로 둬 V1(create table if not exists)은 항상 돈다. cash 표가 이미 있는 DB에서는 아무것도 바꾸지 않는다
  # SQL 번호는 날짜·시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    table: flyway_schema_history_cash
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cash:
  clients:
    pg:
      mode: http
      secret-key: ${TOSS_SECRET_KEY}

# 계좌번호·pgPaymentKey 암호화 키
crypto:
  enabled: true # common global/crypto의 암호화 빈(TextEncryptor, EncryptedStringConverter)을 켠다
  password: ${CRYPTO_PASSWORD}
  salt: ${CRYPTO_SALT}

logging:
  level:
    com:
      bukang: info
