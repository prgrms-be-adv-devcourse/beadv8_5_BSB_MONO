server:
  # member-service(8080)와 동시에 실행하므로 포트를 나눈다
  port: 8081

spring:
  application:
    name: cash-service

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  # 개발 실행(bootRun/IDE) 시 backend/compose.yml의 인프라를 자동으로 띄운다
  # compose.yml과 .env 경로는 common의 LocalDevEnvironmentPostProcessor가 실행 위치와 상관없이 찾아 준다
  docker:
    compose:
      # 여러 서비스가 같은 인프라를 함께 쓰므로, 한 서비스를 종료해도 컨테이너는 멈추지 않는다
      lifecycle-management: start-only

  # Redis가 응답하지 않을 때 오래 기다리지 않도록 대기 시간을 줄인다 (Lettuce 기본값은 명령 60초, 연결 10초)
  # 접속 주소(host, port)는 프로파일별 yaml에 있다
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s

  # Kafka 메시지는 JSON 문자열로 주고받는다 (이유는 member-service의 application.yaml과 README 참고)
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 브로커 연결 대기 3초 (기본 60초). 기다리는 쪽은 회수 입금 릴레이 스케줄러와 알림 발송뿐이고 회원 요청은 기다리지 않는다
        "[max.block.ms]": 3000
        # 브로커 응답을 릴레이의 대기(ClaimDepositedSender 5초)보다 먼저 포기한다. 길면 실패로 본 메시지가 버퍼에 남아
        # 다음 실행에서 다시 보낸 사본과 함께 늦게 나간다 (delivery.timeout.ms는 linger.ms + request.timeout.ms 이상이어야 한다)
        "[request.timeout.ms]": 3000
        "[delivery.timeout.ms]": 4000

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        # 구독한 토픽이 없으면 브로커에 자동 생성을 요청한다 (브로커도 자동 생성을 허용해야 동작)
        "[allow.auto.create.topics]": true

# Swagger / OpenAPI V3 설정 (prod에서는 비활성화)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  open-api:
    info:
      title: Bukang Cash API
      description: 크루 중심 마라톤 대회 예매·커머스 플랫폼 캐시 API
      version: v1

# 시스템 지갑(수수료 수익)·홀딩 지갑(정산 전 보관)의 회원 ID (docs/erd/cash.md 홀딩 지갑)
cash:
  wallet:
    system-member-id: 1
    holding-member-id: 2
  charge:
    confirm:
      # 선점(IN_PROGRESS)한 요청을 기다리는 예산은 선점한 쪽이 끝날 수 있는 가장 긴 시간보다 짧으면 안 된다
      # — 선점한 쪽이 아직 Toss를 기다리는 동안 다른 쪽이 먼저 포기해버릴 수 있다.
      # 가장 긴 경우: 승인 10초(confirm-timeout 5초를 연결·응답에 각각) + 조회 4초 + 재조회 대기 1초 + 재조회 4초 = 19초.
      # 지갑 잠금·기록 처리 여유분을 더해 220회 x 100ms = 22초로 둔다 (게이트웨이의 충전 확정 응답 제한 30초보다 짧게)
      max-wait-attempts: 220
      wait-interval-millis: 100
      # 승인 결과를 모를 때 결제 조회를 곧바로 다시 해 볼 대기 시간(ms). 값 하나마다 한 번 더 조회한다.
      # 늘리면 위 대기 예산과 게이트웨이 응답 제한(30초)도 같이 따져야 한다. 그래도 모르면 대사 배치가 맡는다
      lookup-retry-delays-millis: [1000]
    reconcile:
      # 대사 배치를 돌리는 간격(ms). 이전 실행이 끝난 뒤부터 센다.
      # 맞출 건이 없으면 DB 조회 두 번으로 끝나므로, 짧게 둘수록 확인 중인 충전이 빨리 맞춰진다
      interval-millis: 60000
      # 대사 배치가 IN_PROGRESS를 "멈췄다"고 볼 기준. 선점 대기 예산(22초)보다 충분히 길게 둔다
      stale-in-progress-minutes: 2
      # 이 시간이 지나도 못 맞춘 건은 error 로그로 남겨 사람이 확인한다. Toss는 인증 뒤 승인 안 한 결제를 만료시키므로
      # (문서에 10분·30분이 섞여 있어 긴 쪽을 따름) 이 뒤로도 모르면 PG 조회가 계속 실패하거나 부분 취소된 경우다
      alert-after-minutes: 30
  recovery:
    reconcile:
      # 입금 알림이 빠진 회수 입금(입금 대기)을 PG에 다시 조회하는 간격(ms). 이전 실행이 끝난 뒤부터 센다.
      # 입금 대기 계좌는 90일 동안 남아 있어 건마다 PG를 부르므로 충전 재확인(1분)보다 길게 둔다. 알림이 오면 이 배치를 기다리지 않는다
      interval-millis: 600000

  # PG(Toss페이먼츠) 결제 승인 연동 (PRO-81). mode가 fake면 가짜로 바로 승인하고, http면 실제 Toss API를 부른다
  # 로컬 개발·테스트는 Toss 서버를 안 거쳐도 되게 fake가 기본이고, 운영(prod)은 http다
  clients:
    pg:
      mode: fake
      base-url: https://api.tosspayments.com
      # 연결·응답에 각각 거는 시간 제한. 승인은 카드사까지 다녀오므로 넉넉히, 조회는 Toss 기록만 읽으므로 짧게 둔다
      confirm-timeout: 5s
      lookup-timeout: 2s
