spring:
  datasource:
    # 운영(k8s)은 MYSQL_DB를 주지 않아 이 서비스 DB(crewrun_notification)를 쓴다. 로컬 compose·부하 측정은 MYSQL_DB=bukang-db로 한 DB를 쓴다 (BUK-238)
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB:crewrun_notification}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com:
      bukang: info
