server:
  # 다른 서비스(member 8080, cash 8081, payout 8082, file 8083, order 8084, product 8085)와 동시에 실행하므로 포트를 나눈다
  port: 8086

spring:
  application:
    name: queue-service

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  # 개발 실행(bootRun/IDE) 시 backend/compose.yml의 인프라를 자동으로 띄운다
  # compose.yml과 .env 경로는 common의 LocalDevEnvironmentPostProcessor가 실행 위치와 상관없이 찾아 준다
  docker:
    compose:
      # 여러 서비스가 같은 인프라를 함께 쓰므로, 한 서비스를 종료해도 컨테이너는 멈추지 않는다
      lifecycle-management: start-only

  # Redis가 응답하지 않을 때 오래 기다리지 않도록 대기 시간을 줄인다 (Lettuce 기본값은 명령 60초, 연결 10초)
  # 접속 주소(host, port)는 프로파일별 yaml에 있다
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s

  # 프로파일별 jpa 설정(ddl-auto 등)과 합쳐진다
  jpa:
    properties:
      hibernate:
        # 지연 로딩 연관을 IN 쿼리로 묶어 가져온다 (N+1 완화, 상품·파일 서비스와 같은 값)
        default_batch_fetch_size: 100

  # Kafka 메시지는 JSON 문자열로 주고받는다 (이유는 member-service의 application.yaml과 README 참고)
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        # 구독한 토픽이 없으면 브로커에 자동 생성을 요청한다 (브로커도 자동 생성을 허용해야 동작)
        "[allow.auto.create.topics]": true

# 대기열 승격 (QueuePromotionScheduler, config/QueueProperties)
queue:
  schedule:
    # 승격 주기 (ms). 앞 실행이 끝난 뒤 이만큼 쉬고 다시 돈다
    time: 5000
    # 대기열(대회·종목)마다 한 번에 승격할 인원. 한 종목의 동시 active는 많아야 size × (활성 시간 ÷ 주기)명이다
    size: 20
  active:
    # 활성 시간 (ms, 15분). 승격 시각 + 이 시간이 active 끝 시각이다
    time: 900000
  # 파티 줄 (크루 예매 기간에 파티장이 선다). 승격 주기는 위 schedule.time과 같다
  party:
    schedule:
      # 파티 줄(대회·종목)마다 한 번에 승격할 파티 수. 파티 하나가 파티 인원만큼 자리를 확보하므로 개인(20)보다 작게 둔다
      size: 5
    active:
      # 파티장 활성 시간 (ms, 15분). 승격 시각 + 이 시간이 파티장 active 끝 시각이다
      time: 900000

# Swagger / OpenAPI V3 설정 (prod에서는 비활성화)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  open-api:
    info:
      title: Bukang Queue API
      description: 크루 중심 마라톤 대회 예매·커머스 플랫폼 대기열 API
      version: v1
