# 테스트 전용 설정 (@ActiveProfiles("test")로 활성화)
# 공통 설정(application.yaml)은 그대로 쓰고, 외부 인프라 없이 테스트가 돌도록 필요한 값만 덮어쓴다
spring:
  datasource:
    # MySQL 대신 H2 인메모리 DB 사용 (MySQL 문법 호환 모드)
    url: jdbc:h2:mem:bukang-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # SQL은 System.out 대신 로거(org.hibernate.SQL)로 출력한다 (true면 로거와 중복 출력됨)
        show_sql: false
        format_sql: true
        # 쿼리 수를 세는 테스트(InternalV1MemberNicknamesTest)가 Hibernate 통계를 읽는다
        generate_statistics: true
    open-in-view: false

  # 테스트(H2)는 Flyway를 끄고 Hibernate(create-drop)가 표를 만든다 (BE-024)
  # 기준선 SQL은 FlywayBaselineValidateTest가 따로 확인한다
  flyway:
    enabled: false

  kafka:
    # 전역 임베디드 Kafka 브로커 주소 (junit-platform.properties). 보내기가 바로 성공해 3초씩 기다리지 않는다
    # 버전 차이, 브로커 설정, 장애 상황까지 실제와 똑같이 확인해야 할 때는 테스트 컨테이너(Testcontainers) 방식으로 띄운다
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    listener:
      # 리스너는 테스트가 부르지 않으므로 자동 시작을 끈다
      auto-startup: false

  elasticsearch:
    # Elasticsearch 통합 테스트에서는 Testcontainers(@ServiceConnection)가 이 값을 덮어쓴다
    uris: http://localhost:9200

  data:
    redis:
      host: localhost
      port: 6379

# JWT 서명 키 (dev와 동일)
jwt:
  secret: jwt-dev-secret-key-1423-1126-7541-3217

# 민감 정보 변환 정보 (dev와 동일, salt는 16진수 문자열)
crypto:
  enabled: true # common global/crypto의 암호화 빈(TextEncryptor, EncryptedStringConverter)을 켠다
  password: brH8W0e5axggiZDMxLeEcRiYSf5qght3KtDgWC+dT48=
  salt: d4cc93043cca7c91
  hmac-secret: 5iXOaGlN4SRsdZBruRwXESrPF3qrRAiVpoRGyhCngqo=

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug
    # 바인딩 값까지 확인해야 할 때만 켠다 (테스트 로그가 많아짐)
    # org.hibernate.orm.jdbc.bind: trace

# 본인인증 (BUK-33). 테스트는 포트원을 부르지 않고 PortOneIdentityClient를 목으로 바꾼다
member:
  identity:
    ci-hash-key: identity-ci-hash-test-key
  # CRM 광고 수신 거부 링크 (BUK-75). 테스트용 서명 키
  marketing:
    unsubscribe:
      secret-key: marketing-unsubscribe-test-key-32-bytes-or-more
      front-base-url: http://localhost:3000
  auth:
    # 비밀번호 재설정 (BUK-40). 다시 보내기 간격은 테스트가 기다리지 않도록 0으로 둔다
    password-reset:
      front-base-url: http://localhost:3000
      retry-delays: 0s, 0s, 0s
