# 테스트 실행(JVM) 하나에 임베디드 Kafka 브로커 하나를 띄워 모든 테스트가 같이 쓴다 (spring-kafka-test 전역 임베디드 Kafka)
# 회원 아웃박스 발행 작업이 Kafka로 이벤트를 보낸다. 브로커가 없으면 보낼 때마다 max.block.ms(3초)를 기다리다
# 실패해서 회원 테스트 전체가 10분 넘게 늘어났다. 브로커 주소는 spring.embedded.kafka.brokers로 들어온다(application-test.yaml)
# 테스트 클래스마다 @EmbeddedKafka를 붙이지 않는다. 컨텍스트마다 브로커를 새로 띄우게 된다
# 버전 차이, 브로커 설정, 장애 상황까지 실제와 똑같이 확인해야 할 때는 테스트 컨테이너(Testcontainers) 방식으로 띄운다
spring.kafka.global.embedded.enabled=true
# 회원 서비스가 보내는 토픽. 파티션 1개라 토픽 안 순서가 지켜진다
spring.kafka.embedded.topics=queuing.member.joined,queuing.member.modified,queuing.member.withdrawn,\
  queuing.member.consentchanged,queuing.seller.changed,queuing.crew.memberleft
spring.kafka.embedded.partitions=1
