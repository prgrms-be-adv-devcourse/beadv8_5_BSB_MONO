server:
  port: 8080

spring:
  application:
    name: member-service

  # 개발 실행(bootRun/IDE) 시 backend/compose.yml의 인프라를 자동으로 띄운다
  # compose.yml과 .env 경로는 common의 LocalDevEnvironmentPostProcessor가 실행 위치와 상관없이 찾아 준다
  docker:
    compose:
      # 여러 서비스가 같은 인프라를 함께 쓰므로, 한 서비스를 종료해도 컨테이너는 멈추지 않는다
      lifecycle-management: start-only

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  # Redis가 응답하지 않을 때 오래 기다리지 않도록 대기 시간을 줄인다 (Lettuce 기본값은 명령 60초, 연결 10초)
  # 로그인은 Redis 저장이 실패해도 진행하므로, 장애 때 로그인이 이 시간만큼만 늦어진다 (TokenIssueUseCase)
  # 접속 주소(host, port)는 프로파일별 yaml에 있다
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s

  # 비밀번호 재설정 메일 (BUK-40). 크루런 전용 Gmail 계정의 SMTP로 보낸다. 값은 .env에만 둔다
  # host가 비면 메일을 보내지 않는다. dev·test는 로그에 링크를 찍고, prod는 경고만 남긴다 (MemberMailConfig)
  # 로컬 가짜 메일 서버(Mailpit)는 MAIL_HOST=localhost, MAIL_PORT=1025, MAIL_SMTP_STARTTLS=false로 보낸다
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    # 비우면 SMTP 인증 없이 보낸다 (MemberMailConfig가 mail.smtp.auth를 끈다)
    username: ${MAIL_USERNAME:}
    # Gmail은 Google 계정 비밀번호가 아니라 앱 비밀번호(16자리)
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      # Gmail(587)은 STARTTLS가 필요하다. 암호화를 지원하지 않는 로컬 메일 서버만 false로 끈다
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${MAIL_SMTP_STARTTLS:true}
      # 기본값은 무한 대기라 SMTP 서버가 응답하지 않으면 발송 스레드가 묶인다
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000


  # Kafka
  ## JacksonJsonSerializer / JacksonJsonDeserializer 안쓴 이유

  ##① 역직렬화 실패 시 무한 루프 (가장 중요)
  ## JSON이 깨진 메시지가 하나라도 들어오면, JacksonJsonDeserializer가 예외를 던지고 컨슈머가 같은 offset을 계속 다시 읽습니다. 이른바 poison pill 문제입니다. ErrorHandlingDeserializer로 감싸면 실패한 메시지를 에러 핸들러로 넘기고 다음 메시지로 진행합니다.

  ## ② 타입 헤더에 FQCN이 박힘
  ## spring.json.add.type.headers:
  ##   true이면 __TypeId__ 헤더에 com.example.kafka.shared.member.event.MemberJoinedEvent처럼 클래스 전체 경로(FQCN)가 들어갑니다. 앞에서 이야기한 토픽명 문제와 같은 종류의 결합입니다. 패키지만 옮겨도 컨슈머가 역직렬화에 실패합니다. spring.json.type.mapping으로 논리적인 이름(예: memberJoined)을 쓰면 이 결합이 풀립니다.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 브로커 연결 대기 3초. 기다리는 쪽은 아웃박스 발행 작업 스레드뿐이고 사용자 요청은 기다리지 않는다 (BE-011, BUK-41)
        "[max.block.ms]": 3000
        # 브로커 응답을 아웃박스 발행 작업의 대기(5초)보다 먼저 포기한다. 길면 실패로 기록한 메시지가 버퍼에 남아
        # 다시 보낸 사본과 함께 늦게 나간다 (delivery.timeout.ms는 linger.ms + request.timeout.ms 이상이어야 한다)
        "[request.timeout.ms]": 3000
        "[delivery.timeout.ms]": 4000

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        # 구독한 토픽이 없으면 브로커에 자동 생성을 요청한다 (브로커도 자동 생성을 허용해야 동작)
        "[allow.auto.create.topics]": true

# Swagger / OpenAPI V3 설정 (prod에서는 비활성화)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha            # 태그(컨트롤러) 이름순 정렬
    operations-sorter: method     # API를 HTTP 메서드순으로 정렬
    persist-authorization: true   # 입력한 JWT 토큰을 새로고침해도 유지
  default-produces-media-type: application/json
  open-api:
    info:
      title: Bukang Member API
      description: 크루 중심 마라톤 대회 예매·커머스 플랫폼 API
      version: v1

# JWT 유효 기간 (서명 키 jwt.secret은 프로파일별 yaml에 있다)
# refresh-token-expiration은 Refresh Token을 회전할 때마다 한 번에 늘리는 기간이다
jwt:
  access-token-expiration: 30m
  refresh-token-expiration: 14d

# Refresh Token 회전 정책 (RefreshTokenProperties). 회전은 member-service만 하므로 공용 jwt.*와 따로 둔다
member:
  auth:
    refresh-token:
      # 회전 직후 바로 전 토큰이 다시 와도 탈취로 보지 않는 시간 (탭 두 개, 동시 요청, 응답 유실)
      reuse-grace: 5s
      # 로그인부터 회전을 이어 갈 수 있는 최대 기간. 계속 써도 이 기간이 지나면 다시 로그인한다
      max-lifetime: 30d
    # 카카오·구글 소셜 로그인 (SocialLoginProperties, BE-031). 값은 .env에만 둔다. 키가 비면 그 제공자는 등록하지 않는다
    social:
      # 콜백 주소 앞부분. 제공자 앱에 <이 값>/api/v1/auth/oauth2/callback/kakao(google)를 등록한다
      redirect-base-url: ${OAUTH2_REDIRECT_BASE_URL:http://localhost}
      # 콜백 뒤 보낼 프론트 주소 앞부분. 비우면 같은 도메인의 상대 주소로 보낸다 (Nginx 뒤에서는 비워 둔다)
      front-base-url: ${OAUTH2_FRONT_BASE_URL:}
      kakao:
        client-id: ${OAUTH2_KAKAO_CLIENT_ID:}
        client-secret: ${OAUTH2_KAKAO_CLIENT_SECRET:}
        # 탈퇴·연결 해제 때 카카오 연결 끊기에 쓴다 (BE-034). 비우면 건너뛴다
        admin-key: ${OAUTH2_KAKAO_ADMIN_KEY:}
      google:
        client-id: ${OAUTH2_GOOGLE_CLIENT_ID:}
        client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:}
    # 로그인 실패 제한 (LoginAttemptProperties, BUK-185). 같은 이메일로 max-failures번 틀리면 block-duration 동안 막는다
    login-attempt:
      max-failures: 5
      block-duration: 10m
    # 비밀번호 재설정 (PasswordResetProperties, BUK-40). 숫자는 정책 회의 전 초안 값이다
    password-reset:
      # 메일 링크 앞부분. 운영은 크루런 공개 주소를 넣는다. 요청 Host 헤더로 만들지 않는다
      front-base-url: ${FRONT_PUBLIC_BASE_URL:}
      token-ttl: 30m
      request-cooldown: 1m
      daily-limit: 5
      daily-window: 24h
      # 같은 IP의 하루 요청 수. 여러 이메일로 Gmail 하루 발송 한도(500통)를 다 쓰지 못하게 한다
      ip-daily-limit: 20
      # 발송이 실패하면 이 간격으로 최대 3번 다시 보낸다
      retry-delays: 2s, 10s, 30s
  # 가입 본인인증 (IdentityVerificationProperties, BUK-33, 포트원 V2 + KG이니시스 통합인증). 키 값은 .env에만 둔다
  identity:
    # 같은 사람(CI 해시)이 두 번째 계정을 못 만들게 한다. 테스트 채널 CI가 모두 같은 값이면 false로 끈다
    unique-ci-check: true
    # 탈퇴하고 이 날수가 지나야 같은 사람(CI · 이름 + 생년월일 + 휴대폰 번호)이 다시 가입할 수 있다
    rejoin-block-days: 30
    # CI를 해시할 때 섞는 비밀 키. 비우면 본인인증 확인이 실패한다
    ci-hash-key: ${IDENTITY_CI_HASH_KEY:}
    portone:
      api-secret: ${PORTONE_API_SECRET:}
      store-id: ${PORTONE_STORE_ID:}
  # CRM 광고 수신 거부 링크 (MarketingUnsubscribeProperties, BUK-75, BE-039). 서명 키는 .env에만 둔다
  marketing:
    unsubscribe:
      # 토큰 서명 키. 비우면 링크 발급과 수신 거부가 500으로 실패한다
      secret-key: ${MARKETING_UNSUBSCRIBE_KEY:}
      # 링크 앞부분 (프론트 확인 화면 /unsubscribe). 요청 Host 헤더로 만들지 않는다
      front-base-url: ${FRONT_PUBLIC_BASE_URL:}
      token-ttl: 365d
  # 크루 초대 카카오톡 메시지 (KakaoInviteProperties). 버튼 링크 앞부분이고, 카카오 콘솔 「웹 도메인」에 등록한 도메인이어야 한다
  crew:
    kakao-invite:
      front-base-url: ${FRONT_PUBLIC_BASE_URL:}
  # 다른 서비스 내부 API (탈퇴 전 예치금·참가권 BE-022, 결제율 미달 크루 BUK-187). 로컬 개발은 bootRun으로 띄운 서비스 포트로 부른다
  clients:
    # 연결·응답 시간 제한. 넘으면 탈퇴하지 않고 503으로 다시 시도하게 한다
    timeout: 2s
    cash:
      base-url: http://localhost:8081
    order:
      base-url: http://localhost:8084
    # 크루 파티 만들기 제한에 쓰는 결제율 미달 크루 조회 (BUK-187)
    product:
      base-url: http://localhost:8085
