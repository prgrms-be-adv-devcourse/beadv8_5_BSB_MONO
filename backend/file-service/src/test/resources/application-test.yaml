# 테스트 전용 설정 (@ActiveProfiles("test")로 활성화)
spring:
  datasource:
    # MySQL 대신 H2 인메모리 DB 사용 (MySQL 문법 호환 모드)
    url: jdbc:h2:mem:bukang-file-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: false
        format_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # 브로커 없이도 컨텍스트가 뜨도록 리스너 자동 시작을 끈다
      auto-startup: false
    admin:
      # @RetryableTopic의 재시도·DLT 토픽을 시작할 때 만들지 않는다 (브로커가 없으면 연결을 기다리느라 테스트가 40초 넘게 늦어진다)
      auto-create: false

# 테스트는 개인 .env와 상관없이 로컬 S3Mock 값을 쓴다 (실제 S3에 요청하지 않는다)
file:
  storage:
    s3:
      bucket: bukang-file
      key-prefix: test
      region: ap-northeast-2
      endpoint: http://localhost:9090
      public-endpoint: ""
      path-style: true
      access-key: s3mock
      secret-key: s3mock

# 테스트에서는 Slack으로 보내지 않는다 (빈 값이면 SlackNotifier가 로그만 남긴다)
# 비워 두지 않으면 테스트도 backend/.env의 SLACK_WEBHOOK_URL(팀 알림 채널)을 읽어, 실패를 만드는 테스트가 실제 알림을 보낸다
slack:
  webhook-url: ""

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug
