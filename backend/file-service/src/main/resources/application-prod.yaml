spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

  # Spring Batch 실행 기록 테이블(BATCH_)은 JPA 엔티티가 아니라서 위 ddl-auto(validate)와 상관없다
  # Spring Batch의 SQL 스크립트로 처음 켤 때 만들고, 다음부터는 이미 있다는 오류를 무시한다 (DB 계정에 CREATE 권한 필요)
  batch:
    jdbc:
      initialize-schema: always

  # 표 변경은 Flyway SQL(db/migration)로만 한다
  # 모든 서비스가 같은 스키마를 쓰므로, 기록 표는 file 전용 이름으로 둔다 (다른 서비스의 flyway_schema_history_*와 섞이지 않게)
  # 기준선을 0번으로 둬 V1(create table if not exists)은 항상 돈다. file 표가 이미 있는 DB에서는 아무것도 바꾸지 않는다
  # SQL 번호는 날짜·시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    table: flyway_schema_history_file
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}

# 운영은 기본값 없이 실제 AWS S3를 쓴다. 키를 비워 두면 SDK 기본 자격 증명 체인(EC2 역할 등)을 쓴다
# compose 앱 컨테이너는 compose.yml에서 S3Mock 값을 넘긴다
# 키 앞의 환경 이름(key-prefix)은 환경변수로 받지 않고 여기에 적는다. 운영 객체는 prod/uploads/…, prod/files/…에 쌓인다
file:
  storage:
    s3:
      bucket: ${S3_BUCKET}
      key-prefix: prod
      region: ${AWS_REGION}
      endpoint: ${S3_ENDPOINT:}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:}
      path-style: ${S3_PATH_STYLE:false}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com:
      bukang: info
