spring:
  # 지금은 member-service와 같은 DB(bukang-db)를 쓰고, 테이블 이름 접두사(FILE_)로 구분한다
  datasource:
    url: jdbc:mysql://localhost:3306/bukang-db
    username: bukang2
    password: bukang2
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  # Spring Batch 실행 기록 테이블(BATCH_)을 앱을 켤 때 만든다 (기본값은 H2 같은 내장 DB에서만 만든다)
  # 테이블이 이미 있으면 CREATE 오류를 무시하고 넘어간다 (continue-on-error 기본값 true)
  batch:
    jdbc:
      initialize-schema: always

  # 표 변경은 Flyway SQL(db/migration)로만 한다
  # 모든 서비스가 같은 스키마를 쓰므로, 기록 표는 file 전용 이름으로 둔다 (다른 서비스의 flyway_schema_history_*와 섞이지 않게)
  # 기준선을 0번으로 둬 V1(create table if not exists)은 항상 돈다. file 표가 이미 있는 DB에서는 아무것도 바꾸지 않는다
  # SQL 번호는 날짜·시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    table: flyway_schema_history_file
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  kafka:
    bootstrap-servers:
      - localhost:9092

  # 업로드 테스트 페이지(dev-static/upload-test.html)는 dev 프로파일에서만 연다 (prod에서는 열리지 않는다)
  # 이 값을 정하면 Spring 기본 위치가 바뀌므로 기본 위치 4곳도 함께 적는다
  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - classpath:/dev-static/

# S3 키 앞에 붙이는 환경 이름. 로컬도 운영과 같은 버킷을 쓸 수 있어서 dev/uploads/…, dev/files/…로 나눈다
file:
  storage:
    s3:
      key-prefix: dev

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
