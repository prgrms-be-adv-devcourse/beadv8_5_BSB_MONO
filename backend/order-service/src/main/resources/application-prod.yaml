spring:
  datasource:
    # 운영(k8s)은 MYSQL_DB를 주지 않아 이 서비스 DB(crewrun_order)를 쓴다. 로컬 compose·부하 측정은 MYSQL_DB=bukang-db로 한 DB를 쓴다 (BUK-238)
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB:crewrun_order}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다 (BUK-29)
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

  # 표 변경은 Flyway SQL(db/migration)로만 한다 (BUK-29)
  # 모든 서비스가 같은 스키마를 쓰므로, 기록 표는 order 전용 이름으로 둔다 (회원의 flyway_schema_history_member와 섞이지 않게)
  # 기준선을 0번으로 둬 V1(create table if not exists)은 항상 돈다. 주문 표가 이미 있는 DB에서는 아무것도 바꾸지 않는다
  # SQL 번호는 날짜·시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    table: flyway_schema_history_order
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}

# 다른 서비스는 실제 내부 API로 부른다. compose.yml의 앱 컨테이너끼리는 컨테이너 이름으로 접속한다
order:
  clients:
    product:
      mode: http
      base-url: http://bukang-product-service:8085
    payout:
      mode: http
      base-url: http://bukang-payout-service:8082
    cash:
      mode: http
      base-url: http://bukang-cash-service:8081
    # 대기열 입장 확인은 실제 대기열 서비스에 묻는다 (PRO-226). 프론트가 대기 화면에서 등록·순번 조회를 한 뒤 묻는다(PRO-251)
    # 대기열 대회 복제본에 없는 대회는 줄을 설 수 없어 결제까지 못 간다. 막히면 mode를 fake(누구나 입장)로 되돌린다 (PRO-248)
    queue:
      mode: http
      base-url: http://bukang-queue-service:8086
    # 판매자 확인은 실제 회원 서비스에 묻는다 (주소는 member.base-url, BUK-237)
    seller:
      mode: http
    # 관리자 확인은 실제 회원 서비스에 묻는다 (BUK-26)
    member:
      mode: http
      base-url: http://bukang-member-service:8080
    # 파티의 크루원 확인은 실제 회원 서비스에 묻는다 (BUK-35, 주소는 member.base-url)
    crew:
      mode: http
    # 회원 서비스에 닉네임 조회 API가 생기기 전까지 운영에서는 닉네임 검색을 막는다 (주문번호 검색은 된다, BUK-26)
    nickname:
      mode: disabled
    # 키트 배송 조회는 실제 Delivery Tracker를 부른다 (BUK-55). 키(.env)가 비어 있으면 조회만 실패하고 앱은 뜬다
    delivery-tracker:
      mode: http
      dummy-carrier-enabled: false

crypto:
  enabled: true # common global/crypto의 암호화 빈(TextEncryptor, EncryptedStringConverter)을 켠다 (참가자 휴대폰 번호, BUK-92)
  password: ${CRYPTO_PASSWORD}
  salt: ${CRYPTO_SALT}

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com:
      bukang: info

# 서비스끼리 내부 API(/internal/**)를 부를 때 X-Internal-Key 헤더로 보내는 키 (openssl rand -base64 32 로 만든 값)
# 받는 cash와 부르는 서비스(주문·회원·정산)가 같은 값을 써야 한다. 비어 있으면 cash가 뜨지 않는다
internal:
  api-key: ${INTERNAL_API_KEY}
