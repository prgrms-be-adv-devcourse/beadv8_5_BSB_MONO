server:
  # member-service(8080), cash-service(8081), payout-service(8082), file-service(8083)와 동시에 실행하므로 포트를 나눈다
  port: 8084

spring:
  application:
    name: order-service

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  # 개발 실행(bootRun/IDE) 시 backend/compose.yml의 인프라를 자동으로 띄운다
  # compose.yml과 .env 경로는 common의 LocalDevEnvironmentPostProcessor가 실행 위치와 상관없이 찾아 준다
  docker:
    compose:
      # 여러 서비스가 같은 인프라를 함께 쓰므로, 한 서비스를 종료해도 컨테이너는 멈추지 않는다
      lifecycle-management: start-only

  # @Scheduled 작업(결제 기한 만료 1분, 아웃박스 릴레이 1초, 취소 재처리 1분, 키트 배송 조회 30분, 파티 결제 마감 1분,
  # 키트 발송 알림 매시, 파티 종료 매시)이 쓰레드를 나눠 쓴다 (기본값은 1개). 작업을 더하면 이 수도 함께 늘린다
  # 작업마다 한 쓰레드를 둔다. 모자라면 Kafka가 멈춰 릴레이가 브로커를 기다리거나, 예치금이 느려 만료·취소 재처리가
  # HTTP를 기다리는 동안 다른 작업도 함께 멈춘다
  task:
    scheduling:
      pool:
        size: 7

  # Kafka 메시지는 JSON 문자열로 주고받는다 (이유는 member-service의 application.yaml과 README 참고)
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 브로커가 없을 때 send()가 기다리는 시간 (기본 60초). 아웃박스 릴레이 한 번이 오래 붙잡히지 않게 줄인다 (PRO-270)
        max.block.ms: 3000

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        # 구독한 토픽이 없으면 브로커에 자동 생성을 요청한다 (브로커도 자동 생성을 허용해야 동작)
        "[allow.auto.create.topics]": true

# 스케줄 작업 잠금 (common global/schedulerlock, BUK-206). pod가 여러 개여도 같은 작업은 한 곳에서만 돈다
# 모든 서비스가 같은 DB를 쓰므로 잠금 표 이름에 서비스 접두사를 붙인다 (Flyway SQL로 만든다)
scheduler-lock:
  enabled: true
  table: order_shedlock

# Swagger / OpenAPI V3 설정 (prod에서는 비활성화)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  open-api:
    info:
      title: Bukang Order API
      description: 크루 중심 마라톤 대회 예매·커머스 플랫폼 예매·주문 API
      version: v1

# 다른 서비스 호출 (PRO-99). mode가 fake면 가짜 어댑터가 답하고, http면 실제 내부 API(/internal/v1/...)를 부른다
# 로컬 개발은 다른 서비스를 띄우지 않아도 되게 fake가 기본이고, 운영(prod)은 http다
order:
  clients:
    # 연결·응답 시간 제한. 넘으면 503으로 다시 시도하게 한다
    timeout: 2s
    product:
      mode: fake
      base-url: http://localhost:8085
    payout:
      mode: fake
      base-url: http://localhost:8082
    cash:
      mode: fake
      base-url: http://localhost:8081
    # 대기열 입장 확인 (PRO-191). http면 대기열 서비스 내부 API를 부른다(PRO-226). 로컬은 대기열을 안 띄워도 되게 fake
    queue:
      mode: fake
      base-url: http://localhost:8086
      # 대기열이 Redis를 2초까지 기다리므로 주문은 그보다 길게 기다린다
      timeout: 3s
      # 가짜 대기열의 입장 시간(1~15분). 만료를 빨리 확인하려면 줄인다 (정책은 예매창 15분). 더미 페이지: http://localhost:8084/dev/queue-dummy
      fake-admission-minutes: 15
    # 판매자 키트 API의 판매자 ID 조회 (PRO-197). 실제 연결 전이라 fake(회원 ID = 판매자 ID)만 있다. 운영은 disabled
    seller:
      mode: fake
    # 관리자 API의 관리자 확인 (BUK-26). http면 회원 서비스 내부 API를 부른다. 로컬은 fake(누구나 관리자)
    # member·nickname의 mode는 꼭 적는다. 빠지면 가짜로 열리지 않고 앱이 뜨지 않는다
    member:
      mode: fake
      base-url: http://localhost:8080
    # 파티의 크루원 확인 (BUK-35). http면 회원 서비스 크루 내부 API(member.base-url)를 부른다. 로컬은 fake(누구나 크루원)
    # mode가 빠지면 가짜로 열리지 않고 앱이 뜨지 않는다
    crew:
      mode: fake
    # 관리자 주문 조회의 닉네임 → 회원 ID (BUK-26). 회원 서비스에 API가 없어 fake(시작 데이터 닉네임만)만 있다. 운영은 disabled
    nickname:
      mode: fake
    # 키트 배송 조회 (BUK-55). http면 Delivery Tracker(GraphQL)를 부른다. 로컬은 fake(가짜 택배사 운송장만 답함)
    # 키는 https://console.tracker.delivery 에서 받아 backend/.env의 DELIVERY_TRACKER_CLIENT_ID·SECRET에만 넣는다
    delivery-tracker:
      mode: fake
      base-url: https://apis.tracker.delivery
      client-id: ${DELIVERY_TRACKER_CLIENT_ID:}
      client-secret: ${DELIVERY_TRACKER_CLIENT_SECRET:}
      # Delivery Tracker 권장 시간 제한은 15초까지다
      timeout: 10s
      # 개발용 가짜 택배사(dev.track.dummy)를 발송 목록에 보인다. 운영(prod)은 false
      dummy-carrier-enabled: true
  # 배송 중 키트 조회 배치 (BUK-55). 한 번에 batch-size건, 요청 사이 request-interval (Delivery Tracker는 초당 10번까지)
  kit-tracking:
    interval: PT30M
    batch-size: 100
    request-interval: 200ms
