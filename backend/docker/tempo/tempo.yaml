# 추적 저장소 Tempo 설정 (로컬 전용, compose.yml의 tempo 서비스가 읽기 전용으로 붙인다)
server:
  # 조회 API. Grafana가 이 포트로 trace를 찾는다
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          # Alloy가 span을 보내는 곳. 0.0.0.0이라 같은 네트워크의 다른 컨테이너가 접속할 수 있다
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    # 컨테이너 안 디스크에 저장한다. 컨테이너를 지우면 trace도 지워진다
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Grafana Labs로 사용 통계를 보내지 않는다
usage_report:
  reporting_enabled: false

