# Prometheus 설정 (로컬 전용, compose.yml의 prometheus 서비스가 읽기 전용으로 붙인다)
# Prometheus가 각 서비스의 /actuator/prometheus를 주기적으로 가져간다(Pull)

global:
  # 지표를 가져가는 주기. 짧을수록 그래프가 촘촘하지만 저장량이 늘어난다
  scrape_interval: 15s

scrape_configs:
  # 알림 서비스. 맥에서 bootRun(dev)으로 띄우고 Prometheus는 컨테이너라서,
  # 컨테이너 안에서 맥을 가리키는 host.docker.internal로 접속한다 (localhost는 컨테이너 자신이다)
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8087" ]
  - job_name: cash-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8081" ]
