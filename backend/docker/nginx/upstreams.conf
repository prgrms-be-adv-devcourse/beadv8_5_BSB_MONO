# 뒤쪽 앱 주소. 로컬(default.conf)과 운영(http·https.conf.template)이 함께 include한다
# 컨테이너 이름은 compose.yml의 container_name과 같다. Nginx는 시작할 때 이 이름을 찾으므로 두 컨테이너가 먼저 떠 있어야 한다
upstream gateway {
	server bukang-gateway:8000;
}

upstream web {
	server bukang-web:3000;
}

# 로그인·가입·본인인증(/api/v1/auth/) 요청 횟수 제한. limit_req_zone은 server 밖(http)에만 쓸 수 있어 server보다 먼저 include되는 이 파일에 둔다
# 접속자 IP마다 초당 1건(분당 60건)으로 제한해 비밀번호 대입 속도를 늦춘다. 같은 와이파이의 여러 사람이 함께 로그인하는 것은 routes.conf의 burst(20건)로 받는다
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
# 넘친 요청은 기본값 503 대신 429(요청이 너무 많음)로 응답해 서버 장애와 구분한다
limit_req_status 429;
