# /api는 게이트웨이로, 나머지 화면 요청은 Next.js로 넘긴다. server 블록 안에서 include한다
# 로컬(default.conf)과 운영(http·https.conf.template)이 같은 라우팅을 쓰도록 한곳에 둔다

# 파일 본문은 presigned URL로 S3에 바로 올리므로 API 요청 본문은 작다. 엑셀 명단 같은 예외를 고려해 여유를 둔다
client_max_body_size 10m;

# 뒤쪽 앱이 원래 요청 주소와 접속자 IP를 알 수 있게 넘긴다 (location에서 proxy_set_header를 다시 쓰면 이 값이 사라진다)
# HTTPS로 들어온 요청은 $scheme이 https라서, 앱이 원래 요청이 HTTPS였는지 알 수 있다
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# proxy_pass 뒤에 경로(/)를 붙이지 않아야 /api/v1/... 주소가 잘리지 않고 그대로 넘어간다 (게이트웨이도 자르지 않는다)
location /api/ {
	proxy_pass http://gateway;
}

# 로그인·가입·본인인증은 요청 횟수를 제한한다 (zone은 upstreams.conf). 한 번에 20건까지는 바로 받고, 그 뒤로는 초당 1건씩만 받는다
# 위 /api/보다 긴 주소라 Nginx가 이 블록을 고른다. proxy_set_header는 다시 쓰지 않아 위에서 정한 값이 그대로 넘어간다
location /api/v1/auth/ {
	limit_req zone=auth burst=20 nodelay;
	error_page 429 = @auth_rate_limited;
	proxy_pass http://gateway;
}

# 토큰 재발급은 제한하지 않는다. 앱을 열 때마다 부르고, 실패하면 프론트가 로그인을 풀어 버린다
# 한 번 쓰면 바뀌는 Refresh Token 쿠키가 있어야 성공하므로 비밀번호 대입과 상관없다. = 주소는 위 접두사 블록보다 먼저 골라진다
location = /api/v1/auth/reissue {
	proxy_pass http://gateway;
}

# 가입 화면의 이메일 중복 확인도 같은 한도로 제한한다. 막지 않으면 이메일 목록을 넣어 가입한 이메일을 빠르게 알아낼 수 있다
location = /api/v1/member/members/email-availability {
	limit_req zone=auth burst=20 nodelay;
	error_page 429 = @auth_rate_limited;
	proxy_pass http://gateway;
}

# 제한에 걸린 응답도 다른 API와 같은 RsData JSON으로 보내 프론트가 message를 그대로 띄울 수 있게 한다
location @auth_rate_limited {
	default_type application/json;
	return 429 '{"status":429,"code":"TOO_MANY_REQUESTS","message":"요청이 너무 많아요. 잠시 뒤 다시 시도해 주세요.","data":null}';
}

# 서비스끼리만 쓰는 주소. 게이트웨이도 막지만 입구에서 한 번 더 막는다
location /internal/ {
	return 404;
}

location / {
	proxy_pass http://web;
}
