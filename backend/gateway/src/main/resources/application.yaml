server:
  # 서비스 포트(8080~8087)와 겹치지 않게 둔다. Nginx는 /api를 이 포트로 넘긴다
  port: 8000

spring:
  application:
    name: gateway

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  cloud:
    gateway:
      server:
        webflux:
          # 서비스로 넘긴 요청의 시간 제한. 꺼진 서비스나 멈춘 서비스를 기다리느라 게이트웨이 연결이 쌓이지 않게 한다
          # 연결 시간 초과·연결 거부·서비스 이름을 찾지 못함은 503, 응답 시간 초과는 504로 응답한다 (GatewayErrorHandler)
          httpclient:
            # 서비스와 연결을 맺기까지 기다리는 시간(ms 단위 숫자)
            connect-timeout: 2000
            # 요청을 보낸 뒤 응답을 받기까지 기다리는 시간
            response-timeout: 10s
          # 주소 앞부분을 자르지 않는다(StripPrefix 없음). 서비스 주소와 쿠키 경로가 게이트웨이 주소와 그대로 맞아야 한다
          # /internal/**는 규칙을 만들지 않는다. 맞는 규칙이 없으면 게이트웨이가 404로 응답한다
          # 서비스 주소(gateway.services.*)는 프로파일별 yaml에 있다 (dev: localhost, prod: 컨테이너 이름)
          # 서비스는 X-Member-Id 헤더를 로그인한 회원으로 믿는다. 클라이언트가 보낸 값을 지우고 토큰 속 회원 ID로 다시 넣는 일은
          # JwtAuthenticationFilter가 한다 (default-filters로 지우면 필터가 넣은 값까지 지워질 수 있어 한곳에서 처리)
          default-filters:
            # 브라우저에 "이 사이트는 1년 동안 HTTPS로만 접속"하라고 알린다 (HSTS). HTTPS 응답에서만 효력이 있고 HTTP(로컬)에서는 무시된다
            # 화면과 API가 Nginx 뒤 같은 주소라 화면에도 적용된다. 도메인 구성이 정해지지 않아 includeSubDomains는 넣지 않는다
            - AddResponseHeader=Strict-Transport-Security, max-age=31536000
          routes:
            - id: member-service
              uri: ${gateway.services.member}
              predicates:
                - Path=/api/v1/member/**,/api/v1/auth/**
            # 예치금 충전 확정은 Toss 결제 승인을 기다린다 (승인 + 결과를 모를 때 조회·재조회까지 최악 약 19초, cash-service의 cash.charge.confirm 참고)
            # 게이트웨이가 먼저 504로 끊으면 서비스는 승인·입금을 끝냈는데 화면은 실패로 보이므로, 이 주소만 30초로 늘린다
            # 아래 cash-service(/api/v1/cash/**)보다 먼저 맞아야 하므로 그 위에 둔다
            - id: cash-charge-confirm
              uri: ${gateway.services.cash}
              predicates:
                - Path=/api/v1/cash/charges/confirm
              metadata:
                response-timeout: 30000
            # 환급 신청(POST)도 응답 시간 제한을 30초로 늘린다. 캐시 서비스 요청이라 10초를 넘기면 서비스는 끝냈는데 화면은 504로 보인다
            # 목록 조회 같은 다른 요청은 기본 10초를 쓴다. 아래 cash-service보다 먼저 맞아야 하므로 그 위에 둔다
            - id: cash-withdrawal
              uri: ${gateway.services.cash}
              predicates:
                - Path=/api/v1/cash/withdrawals
                - Method=POST
              metadata:
                response-timeout: 30000
            - id: cash-service
              uri: ${gateway.services.cash}
              predicates:
                - Path=/api/v1/cash/**
            # dev의 정산 배치 수동 실행 API만 응답 시간 제한을 5분(ms 단위 숫자)으로 늘린다. prod에는 그 API가 없다
            # 정산 생성일 배치는 주문 서비스를 최대 30초 기다리고, 지급 배치는 정산 내역마다 캐시 서비스를 불러 건수만큼 길어진다
            # Nginx를 거치면 Nginx의 기본 응답 대기(60초)에 먼저 걸리므로, 오래 걸리는 배치는 게이트웨이(8000)로 바로 부른다
            # 아래 payout-service(/api/v1/payout/**)보다 먼저 맞아야 하므로 그 위에 둔다
            - id: payout-dev-batch
              uri: ${gateway.services.payout}
              predicates:
                - Path=/api/v1/payout/dev/batches/**
              metadata:
                response-timeout: 300000
            - id: payout-service
              uri: ${gateway.services.payout}
              predicates:
                - Path=/api/v1/payout/**
            - id: file-service
              uri: ${gateway.services.file}
              predicates:
                - Path=/api/v1/file/**
            - id: order-service
              uri: ${gateway.services.order}
              predicates:
                - Path=/api/v1/order/**
            - id: product-service
              uri: ${gateway.services.product}
              predicates:
                - Path=/api/v1/product/**
            - id: queue-service
              uri: ${gateway.services.queue}
              predicates:
                - Path=/api/v1/queue/**
            - id: notification-service
              uri: ${gateway.services.notification}
              predicates:
                - Path=/api/v1/notification/**
            - id: inquiry-service
              uri: ${gateway.services.inquiry}
              predicates:
                - Path=/api/v1/inquiry/**
            - id: board-service
              uri: ${gateway.services.board}
              predicates:
                - Path=/api/v1/board/**

gateway:
  auth:
    # 토큰 없이 통과하는 주소 (JwtAuthenticationFilter). 여기 없는 주소는 토큰이 없으면 게이트웨이가 401로 막는다
    # 로그인 전에 쓰는 API를 서비스에 추가하면 여기에도 추가한다. 빠뜨리면 그 API가 401로 막힌다(열리지는 않는다)
    # pattern: "/a/b"는 정확히 같은 주소만, "/a/**"는 그 아래 전부. methods: 비우면 모든 메서드
    # 공개 주소라도 유효한 토큰이 있으면 회원 ID를 넘긴다 (예: 대회 상세의 "이미 신청함" 표시)
    public-paths:
      # 재발급·로그아웃은 Refresh Token 쿠키로 본인을 확인하므로 Access Token이 만료돼도 부를 수 있어야 한다
      - pattern: /api/v1/auth/join
      - pattern: /api/v1/auth/login
      - pattern: /api/v1/auth/reissue
      - pattern: /api/v1/auth/logout
      # 카카오·구글 소셜 로그인 시작·콜백·소셜 가입은 로그인 전에 쓴다 (BE-031). 계정 연결 표 발급은 회원 주소라 토큰이 필요하다
      - pattern: /api/v1/auth/oauth2/**
      # 비밀번호 재설정 메일 요청·링크 확인·새 비밀번호 저장은 로그인 전에 쓴다 (BUK-40)
      - pattern: /api/v1/auth/password-reset/**
        methods: [ POST ]
      # 가입 본인인증(포트원)은 로그인 전에 쓴다 (BUK-33)
      - pattern: /api/v1/auth/identity-verifications/**
        methods: [ POST ]
      # 가입 화면이 로그인 전에 이메일 중복을 확인한다
      - pattern: /api/v1/member/members/email-availability
        methods: [ GET ]
      # 광고 메시지의 수신 거부 확인 화면이 로그인 없이 부른다. 본인 확인은 서명한 토큰으로 한다 (BUK-75)
      - pattern: /api/v1/member/marketing-consent/unsubscribe
        methods: [ POST ]
      # 로그인 없이 대회 목록·상세를 볼 수 있게 한다. 등록·수정(POST 등)은 토큰이 필요하다
      - pattern: /api/v1/product/**
        methods: [ GET ]
      # 대회 상세가 로그인 없이 들어갈 대기열(파티·개인)을 알려 준다 (BUK-116)
      # 이 주소의 GET만 연다. 대기열 등록(POST)과 순번 조회는 그대로 토큰이 필요하다
      - pattern: /api/v1/queue/races/*/entry
        methods: [ GET ]
      # 대회 사진 등 대상에 연결된 파일은 누구나 본다. 연결 전 파일을 올린 회원만 보게 막는 일은 file-service가 한다
      # (/** 는 그 아래가 없는 /api/v1/file/files 목록 조회도 포함한다)
      - pattern: /api/v1/file/files/**
        methods: [ GET ]
      # 게시판은 로그인 없이 읽을 수 있다. 글·댓글·좋아요 쓰기(POST·PUT·DELETE)는 토큰이 필요하다
      # 토큰이 있으면 회원 ID를 넘겨 "내가 누른 좋아요", "내 숨겨진 글"을 보여 준다
      - pattern: /api/v1/board/**
        methods: [ GET ]
      # 토스가 가상계좌 입금을 알린다. 토스는 우리 토큰이 없고, 진짜 알림인지는 cash-service가 비밀값과 토스 조회로 확인한다 (BUK-146)
      - pattern: /api/v1/cash/webhooks/toss/deposit
        methods: [ POST ]
