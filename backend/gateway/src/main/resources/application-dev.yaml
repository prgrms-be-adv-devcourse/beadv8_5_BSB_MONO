# 서비스를 bootRun/IDE로 호스트에서 실행할 때의 주소
spring:
  # 게이트웨이는 common(LocalDevEnvironmentPostProcessor)을 쓰지 않으므로 backend/.env를 직접 읽는다 (JWT_SECRET)
  # 실행 위치가 gateway/, backend/, 저장소 루트 중 어디여도 찾도록 세 경로를 모두 적는다
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:backend/.env[.properties]"
  data:
    redis:
      host: localhost
      port: 6379

gateway:
  services:
    member: http://localhost:8080
    cash: http://localhost:8081
    payout: http://localhost:8082
    file: http://localhost:8083
    order: http://localhost:8084
    product: http://localhost:8085
    queue: http://localhost:8086
    notification: http://localhost:8087
    inquiry: http://localhost:8088
    board: http://localhost:8089
    ai: http://localhost:8092

# Access Token 검사용 서명 키. member-service가 발급할 때 쓰는 키와 같아야 한다
jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.bukang: debug
