# 서비스를 bootRun/IDE로 호스트에서 실행할 때의 주소
gateway:
  services:
    member: http://localhost:8080
    cash: http://localhost:8081
    payout: http://localhost:8082
    file: http://localhost:8083
    order: http://localhost:8084
    product: http://localhost:8085
    queue: http://localhost:8086
    notification: http://localhost:8087
    inquiry: http://localhost:8088
    board: http://localhost:8089

# Access Token 검사용 서명 키. member-service가 발급할 때 쓰는 키와 같아야 한다
jwt:
  secret: jwt-dev-secret-key-1423-1126-7541-3217

logging:
  level:
    com.bukang: debug

# 추적·로그 설정 (common의 observability.yaml dev 부분과 같은 내용. gateway는 common을 쓰지 않아 직접 둔다)
management:
  tracing:
    sampling:
      # 로컬은 요청을 전부 추적한다 (기본 0.1 = 10개 중 1개만)
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # 이 주소가 있을 때만 span을 내보낸다. 맥에서 띄운 Alloy로 보낸다
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          # 이 주소가 있을 때만 로그를 내보낸다(observability-dev의 appender도 이 주소를 보고 붙는다)
          endpoint: http://localhost:4318/v1/logs
