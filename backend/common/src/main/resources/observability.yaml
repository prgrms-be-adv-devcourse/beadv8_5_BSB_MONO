# 모든 서비스가 같이 쓰는 지표·추적 설정. 각 서비스 application.yaml이 spring.config.import로 불러온다
# 부품(actuator, Prometheus 레지스트리, OTel)은 루트 build.gradle.kts가 넣는다
# 불러온 이 파일의 값이 서비스 application.yaml 값보다 우선한다. 서비스만 다르게 하려면 application-{프로필}.yaml에 적는다

# Prometheus가 /actuator/prometheus를 15초마다 가져간다 (backend/docker/prometheus/prometheus.yml)
management:
  endpoints:
    web:
      exposure:
        # 웹으로는 상태 확인과 지표만 연다. env·beans처럼 설정값이 보이는 엔드포인트는 열지 않는다
        include: health, prometheus
  metrics:
    tags:
      # 여러 서비스의 지표를 모을 때 어느 서비스 것인지 나누려고 모든 지표에 서비스 이름을 붙인다
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 응답 시간을 구간별 개수(_bucket)로도 내보내, Prometheus의 histogram_quantile로 p95·p99를 계산한다
        # 이름에 .이 있어 [ ]로 감싼다 (감싸지 않으면 http → server → requests로 나눠 읽는다)
        "[http.server.requests]": true
  otlp:
    metrics:
      export:
        # OTel 스타터가 메트릭도 OTLP로 1분마다 보내려 한다 (기본 켜짐, 주소 localhost:4318)
        # 메트릭은 Prometheus가 가져가는(Pull) 방식으로 정했으므로 끈다
        enabled: false

---
# 여기부터는 dev 프로필(bootRun)에서만 적용된다. 운영에는 추적 주소가 들어가지 않고, 운영 jar에는 OTel도 없다
spring:
  config:
    activate:
      on-profile: dev
  kafka:
    # 보낼 때 traceparent 헤더를 붙이고 받을 때 읽어, 서비스 사이(Kafka) 추적을 하나로 잇는다
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

management:
  tracing:
    sampling:
      # 로컬은 요청을 전부 추적한다 (기본 0.1 = 10개 중 1개만)
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # 이 주소가 있을 때만 span을 내보낸다. 맥에서 띄운 Alloy(compose.yml의 alloy, monitoring 프로필)로 보낸다
          endpoint: http://localhost:4318/v1/traces
