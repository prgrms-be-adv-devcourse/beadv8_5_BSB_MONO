server:
  # 다른 서비스(member 8080, cash 8081, payout 8082, file 8083, order 8084)와 동시에 실행하므로 포트를 나눈다
  port: 8085

spring:
  application:
    name: product-service

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  # 개발 실행(bootRun/IDE) 시 backend/compose.yml의 인프라를 자동으로 띄운다
  # compose.yml과 .env 경로는 common의 LocalDevEnvironmentPostProcessor가 실행 위치와 상관없이 찾아 준다
  docker:
    compose:
      # 여러 서비스가 같은 인프라를 함께 쓰므로, 한 서비스를 종료해도 컨테이너는 멈추지 않는다
      lifecycle-management: start-only

  # @Scheduled 작업(아웃박스 전송 1초, 검색 문서 동기화 1초, 크루 자리 배치 매시 정각, 판매 상태 배치 5분 정각)이
  # 저마다 스레드를 쓰게 한다. 기본값 1이면 0시 정각에 크루 자리 배치와 판매 상태 배치가 한 스레드를 나눠 써,
  # 한쪽이 끝날 때까지 다른 쪽(예: 판매 상태 변경)이 늦어진다 (PR #358 리뷰)
  task:
    scheduling:
      pool:
        size: 4

  # JPA 공통 (ddl-auto와 SQL 출력 형식은 프로파일별 yaml)
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # 지연 로딩 연관을 IN 쿼리로 묶어 가져온다 (N+1 완화)
        default_batch_fetch_size: 100

  # Kafka 공통 (브로커 주소는 프로파일별 yaml)
  # 메시지는 JSON 문자열로 주고받고, 객체 변환은 common의 JsonConverter가 한다
  # Spring Kafka의 JSON 직렬화기를 쓰지 않는 이유: member-service의 application.yaml, backend/README.md "Kafka 메시지 직렬화"
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 컨슈머 그룹이 처음 붙으면 토픽의 처음부터 읽는다
      auto-offset-reset: earliest
      properties:
        # 구독한 토픽이 없으면 브로커에 자동 생성을 요청한다 (브로커도 자동 생성을 허용해야 동작)
        "[allow.auto.create.topics]": true

# Swagger / OpenAPI V3 설정 (prod에서는 비활성화)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  open-api:
    info:
      title: Bukang Product API
      description: 크루 중심 마라톤 대회 예매·커머스 플랫폼 상품(대회·종목) API
      version: v1
