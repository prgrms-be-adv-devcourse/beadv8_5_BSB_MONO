spring:
  datasource:
    # 운영(k8s)은 MYSQL_DB를 주지 않아 이 서비스 DB(crewrun_product)를 쓴다. 로컬 compose·부하 측정은 MYSQL_DB=bukang-db로 한 DB를 쓴다 (BUK-238)
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB:crewrun_product}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다
      ddl-auto: validate

  # 표 변경은 Flyway SQL(db/migration)로만 한다
  # 모든 서비스가 같은 스키마를 쓰므로, 기록 표는 product 전용 이름으로 둔다 (다른 서비스의 flyway_schema_history_*와 섞이지 않게)
  # 기준선을 0번으로 둬 V1(create table if not exists)은 항상 돈다. product 표가 이미 있는 DB에서는 아무것도 바꾸지 않는다
  # SQL 번호는 날짜·시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    table: flyway_schema_history_product
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 관리자 확인은 실제 회원 서비스에 묻는다. k8s Service 이름(bukang-member-service)으로 접속한다
product:
  clients:
    member:
      mode: http
      base-url: http://bukang-member-service:8080

logging:
  level:
    com.bukang: info
