# 테스트 전용 설정 (@ActiveProfiles("test")로 활성화)
spring:
  datasource:
    # MySQL 대신 H2 인메모리 DB 사용 (MySQL 문법 호환 모드)
    url: jdbc:h2:mem:bukang-product-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # 브로커 없이도 컨텍스트가 뜨도록 리스너 자동 시작을 끈다
      auto-startup: false
    admin:
      # @RetryableTopic의 재시도·DLT 토픽을 시작할 때 만들지 않는다 (브로커가 없으면 연결을 기다리느라 테스트가 40초 넘게 늦어진다)
      auto-create: false

  # 테스트도 Ollama로 임베딩한다 (OpenAI 요금이 나가지 않게)
  # Testcontainers가 아니라 compose로 띄운 bukang-ollama(localhost:11434)를 부른다. 모델을 받아 둔 Ollama가 켜져 있어야 한다
  #   docker compose --profile ai up -d bukang-ollama
  #   docker compose exec bukang-ollama ollama pull nomic-embed-text
  # 빈을 만들 때는 Ollama에 접속하지 않으므로(pull-model-strategy 기본값 never), Ollama가 꺼져 있어도 컨텍스트는 뜬다
  ai:
    model:
      embedding: ollama
      chat: ollama
    ollama:
      # 테스트에서는 Ollama 컨테이너의 주소로 바뀐다 (TestcontainersConfiguration의 @ServiceConnection)
      base-url: http://localhost:11434
      embedding:
        # 기본 768차원. 384차원으로 줄이는 설정은 AiConfig에 있다
        model: nomic-embed-text
      chat:
        model: qwen2.5:0.5b

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug
