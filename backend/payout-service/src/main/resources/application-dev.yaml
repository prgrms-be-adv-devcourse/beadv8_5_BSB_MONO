spring:
  # 지금은 다른 서비스와 같은 DB(bukang-db)를 쓰고, 테이블 이름 접두사(PAYOUT_)로 구분한다
  datasource:
    url: jdbc:mysql://localhost:3306/bukang-db
    username: bukang2
    password: bukang2
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다 (PR #265)
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true
    open-in-view: false

  # 표 변경은 Flyway SQL(db/migration)로만 한다 (PR #265, member-service와 같은 방식)
  # 모든 서비스가 같은 스키마를 쓰므로, 기록 표는 payout 전용 이름으로 둔다 (다른 서비스의 기록 표와 섞이지 않게)
  # 기준선을 0번으로 둬 V1(create table if not exists)은 항상 돈다. 정산 표가 이미 있는 DB에서는 아무것도 바꾸지 않는다
  # SQL 번호는 날짜 · 시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    table: flyway_schema_history_payout
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  kafka:
    bootstrap-servers:
      - localhost:9092

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 정산이 부르는 다른 서비스 주소 (게이트웨이의 gateway.services.*와 같은 방식). 로컬에서는 각 서비스를 bootRun으로 띄운다
payout:
  services:
    order: http://localhost:8084
    cash: http://localhost:8081
    product: http://localhost:8085
    # 판매자 정산 조회에서 회원 ID를 판매자 ID로 바꿀 때(MemberSellerLookupAdapter), 관리자 API에서 관리자인지 물을 때(MemberAdminAdapter) 부른다
    member: http://localhost:8080
