spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다 (PR #265)
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

  # 표 변경은 Flyway SQL(db/migration)로만 한다 (PR #265, member-service와 같은 방식)
  # 모든 서비스가 같은 스키마를 쓰므로, 기록 표는 payout 전용 이름으로 둔다 (다른 서비스의 기록 표와 섞이지 않게)
  # 기준선을 0번으로 둬 V1(create table if not exists)은 항상 돈다. 정산 표가 이미 있는 DB에서는 아무것도 바꾸지 않는다
  # SQL 번호는 날짜 · 시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    table: flyway_schema_history_payout
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com:
      bukang: info

# 정산이 부르는 다른 서비스 주소. compose.yml의 컨테이너 이름으로 찾는다 (/internal/** 은 게이트웨이를 거치지 않고 직접 부른다)
payout:
  services:
    order: http://bukang-order-service:8084
    cash: http://bukang-cash-service:8081
    product: http://bukang-product-service:8085
    member: http://bukang-member-service:8080
