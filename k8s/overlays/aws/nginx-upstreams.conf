# 운영(AWS) nginx의 뒤쪽 앱 주소 (CRU-75). base의 backend/docker/nginx/upstreams.conf를 이 파일로 바꿔 쓴다 (kustomization.yaml)
# !! upstream web·limit_req 부분은 base 파일과 같아야 한다. base를 고치면 이 파일도 같이 고친다
#
# 게이트웨이를 두 곳에 두고 요청을 번갈아 보낸다
#   게이트웨이 1: 메인 EC2 k3s의 Service bukang-gateway
#   게이트웨이 2: 보조 EC2(10.0.2.222)의 compose 컨테이너 bukang-gateway2 (infra/data-node/compose.data.yml)
# 한쪽이 연결을 받지 않으면 그 요청은 다른 쪽으로 다시 보내고(proxy_next_upstream 기본값 error timeout),
# 10초 동안 실패한 쪽으로 보내지 않는다(max_fails·fail_timeout). 연결 전에 실패한 요청은 POST도 다시 보낸다
upstream gateway {
	server bukang-gateway:8000 max_fails=2 fail_timeout=10s;
	server 10.0.2.222:8000 max_fails=2 fail_timeout=10s;
	# 게이트웨이와 맺은 연결을 끊지 않고 다시 쓴다 (HTTP keep-alive, CRU-58). 두 게이트웨이에 함께 적용된다
	# routes.conf의 proxy_http_version 1.1과 Connection ""가 함께 있어야 동작한다
	keepalive 64;
}

# 보조 EC2가 꺼져 응답이 없을 때 연결을 기다리는 시간 (기본 60초). 짧게 두어 바로 게이트웨이 1로 넘긴다
# 같은 VPC 안이라 정상일 때는 1ms 안에 연결된다. server 블록보다 먼저 include되는 이 파일(http 단계)에 두면 모든 location에 적용된다
proxy_connect_timeout 2s;

upstream web {
	server bukang-web:3000;
}

# 로그인·가입·본인인증(/api/v1/auth/) 요청 횟수 제한. limit_req_zone은 server 밖(http)에만 쓸 수 있어 server보다 먼저 include되는 이 파일에 둔다
# 접속자 IP마다 초당 1건(분당 60건)으로 제한해 비밀번호 대입 속도를 늦춘다. 같은 와이파이의 여러 사람이 함께 로그인하는 것은 routes.conf의 burst(20건)로 받는다
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
# 넘친 요청은 기본값 503 대신 429(요청이 너무 많음)로 응답해 서버 장애와 구분한다
limit_req_status 429;
