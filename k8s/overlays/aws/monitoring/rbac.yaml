# 수집기(metrics-agent)가 k8s에 물어볼 수 있는 범위 (BUK-258)
#   pods: Spring 앱 Pod를 찾는다 (IP가 바뀌어도 따라가려고)
#   nodes: 노드(메인 EC2)의 사설 IP를 알아낸다 (node-exporter 주소)
#   nodes/proxy, nodes/metrics: API 서버를 거쳐 kubelet의 Pod CPU·메모리 지표(cAdvisor)를 읽는다
# 읽기(get/list/watch)만 있다. 무엇도 만들거나 고치지 못한다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-agent
---
# 노드는 네임스페이스 밖 객체라 ClusterRole로 준다. 같은 클러스터를 다른 것과 함께 쓰지 않아 crewrun- 접두사로 구분만 한다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crewrun-metrics-agent
rules:
  - apiGroups: [ "" ]
    resources: [ nodes, nodes/proxy, nodes/metrics, pods ]
    verbs: [ get, list, watch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crewrun-metrics-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crewrun-metrics-agent
subjects:
  # namespace는 overlays/aws/kustomization.yaml의 namespace(crewrun)가 채운다
  - kind: ServiceAccount
    name: metrics-agent
