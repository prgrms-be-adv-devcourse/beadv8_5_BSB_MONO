# 운영(AWS 메인 EC2 k3s)용. 앱은 k3s에, 인프라는 보조 EC2(10.0.2.222)의 compose에 있다
# 적용은 메인 EC2의 infra/main-node/deploy.sh가 한다. 직접 적용하지 않는다
#   deploy.sh가 하는 일: Parameter Store에서 secret.yaml 만들기 → 이미지 태그를 배포 커밋 SHA로 바꾸기 → 적용 → secret.yaml 지우기
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# overlay에서 더하는 객체(external-infra.yaml, secret.yaml)에도 crewrun을 채운다
namespace: crewrun

resources:
  - ../../base
  - external-infra.yaml
  # 앱의 비밀값 (Secret app-secret). git에 올라가지 않는다. 키 목록은 secret.yaml.example
  - secret.yaml

# 앱 이미지를 GHCR 주소로 바꾼다. 태그는 deploy.sh가 배포 커밋 SHA로 덮어쓴다 (GitHub Actions가 SHA 태그로 올린다)
# 여기 적힌 deploy-sha는 자리표시자다. 이 값 그대로 뜨면 이미지를 찾지 못해 ImagePullBackOff가 난다
images:
  - name: bukang-gateway
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-gateway
    newTag: deploy-sha
  - name: bukang-member-service
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-member-service
    newTag: deploy-sha
  - name: bukang-cash-service
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-cash-service
    newTag: deploy-sha
  - name: bukang-payout-service
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-payout-service
    newTag: deploy-sha
  - name: bukang-file-service
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-file-service
    newTag: deploy-sha
  - name: bukang-order-service
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-order-service
    newTag: deploy-sha
  - name: bukang-product-service
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-product-service
    newTag: deploy-sha
  - name: bukang-queue-service
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-queue-service
    newTag: deploy-sha
  - name: bukang-notification-service
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-notification-service
    newTag: deploy-sha
  - name: bukang-board-service
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-board-service
    newTag: deploy-sha
  - name: bukang-ai-service
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-ai-service
    newTag: deploy-sha
  - name: bukang-web
    newName: ghcr.io/prgrms-be-adv-devcourse/bukang-web
    newTag: deploy-sha

patches:
  # base의 ConfigMap app-config에 운영 값을 덮어쓰고 더한다 (S3·사이트 주소·소셜 로그인 앱 ID 등)
  - path: app-config.yaml
  # 도메인과 HTTPS. 인증서는 Traefik이 Let's Encrypt에서 받는다 (infra/main-node/traefik-config.yaml)
  - path: ingress.yaml
  # GHCR 이미지가 비공개라, 이미지를 받을 때 로그인 정보(Secret ghcr-pull)를 쓰게 한다
  # ghcr-pull은 deploy.sh가 Parameter Store의 /crewrun/registry/GHCR_AUTH로 만든다
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
