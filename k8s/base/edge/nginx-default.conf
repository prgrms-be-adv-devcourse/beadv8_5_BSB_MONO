# k8s용 nginx 입구. compose의 docker/nginx/default.conf와 같지만, 앞에 Traefik이 하나 더 있다
#   인터넷 → Traefik(HTTPS) → 이 nginx → gateway / web
# routes.conf·upstreams.conf는 compose와 같은 파일이다 (k8s/base/kustomization.yaml의 nginx-config)
include /etc/nginx/crewrun/upstreams.conf;

server {
	listen 80;
	server_name _;

	# Traefik을 거쳐 오면 접속자 IP($remote_addr)가 Traefik Pod의 IP로 보인다
	# 그러면 로그인 요청 제한(limit_req)과 비밀번호 재설정 IP 제한(BUK-40, X-Real-IP)이 모든 사용자를 한 사람으로 센다
	# 클러스터 안(k3s Pod 대역 10.42.0.0/16)에서 온 요청만 믿고, X-Forwarded-For에서 진짜 접속자 IP를 꺼내 $remote_addr로 쓴다
	set_real_ip_from 10.42.0.0/16;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;

	include /etc/nginx/crewrun/routes.conf;
}
