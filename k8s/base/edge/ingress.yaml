# 클러스터 밖에서 들어오는 요청을 모두 nginx로 넘긴다 (k3s에 기본으로 들어 있는 Traefik이 처리한다)
# 교안처럼 Ingress에서 서비스별로 나누지 않는다. 서비스별 라우팅은 Spring Gateway가, 입구 규칙은 nginx가 맡는다
# host를 적지 않아 어느 주소로 와도 받는다 (로컬: http://localhost). 운영 도메인·HTTPS는 overlays/aws에서 덧붙인다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crewrun
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bukang-nginx
                port:
                  name: http
