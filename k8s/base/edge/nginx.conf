# k8s nginx 본체 설정. nginx:1.30.7-alpine 이미지의 (1.28과 같은) 기본 /etc/nginx/nginx.conf를 복사하고 연결 한도만 바꿨다
# 바꾼 이유: 11/19 부하 테스트에서 새 연결이 2,232개 몰려 입구 줄(accept 큐)이 넘쳤다
#   기본값은 워커 2개 × 1,024 연결이고, 요청 하나가 앞뒤로 연결 2개(Traefik 쪽, 게이트웨이 쪽)를 써서 약 1,000명분이다
#   워커가 연결을 더 받지 못하면 입구 줄이 비워지지 않아 넘치므로, 줄 길이(nginx-default.conf의 backlog)와 함께 늘린다
# 이미지 버전을 올리면 그 버전의 기본 nginx.conf와 다시 맞춘다
user  nginx;
# 코어 수만큼 워커를 띄운다 (메인 EC2는 2개)
worker_processes  auto;
# 연결 하나가 파일 하나를 쓴다. 워커당 연결 4,096개보다 넉넉하게 연다
worker_rlimit_nofile  16384;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
	# 워커 하나가 동시에 여는 연결 수 (기본 1,024). 연결마다 버퍼를 잡으므로 nginx.yaml의 메모리 상한도 함께 올렸다
	worker_connections  4096;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
		'$status $body_bytes_sent "$http_referer" '
		'"$http_user_agent" "$http_x_forwarded_for"';

	access_log  /var/log/nginx/access.log  main;

	sendfile        on;

	keepalive_timeout  65;

	include /etc/nginx/conf.d/*.conf;
}
