# 입구 규칙을 맡는 nginx. compose의 nginx와 같은 routes.conf를 써서
# 로그인 요청 횟수 제한(429 JSON 응답), /internal 막기, 접속자 IP 전달이 지금과 똑같이 동작한다
# HTTPS는 앞의 Traefik이 맡으므로 여기서는 80(HTTP)만 받는다
#
# compose 때는 nginx가 시작할 때 컨테이너 IP를 한 번만 찾아서, 앱이 새로 뜨면 옛 IP로 보내 502가 났다(11/6 장애)
# k8s에서는 upstream(bukang-gateway, bukang-web)이 Service의 고정 IP라 앱 Pod가 바뀌어도 다시 읽을 필요가 없다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bukang-nginx
  # Deployment 자체에 붙는 라벨
  #   name: 이 앱의 이름표. 설정에서 읽는 곳은 없다 (kubectl get deploy -l app.kubernetes.io/name=... 로 고를 때 쓴다)
  labels:
    app.kubernetes.io/name: nginx
spec:
  replicas: 1
  selector:
    # 이 Deployment가 "내 Pod"로 보는 기준. 아래 template의 Pod 라벨에 같은 값이 있어야 한다
    # (template에는 라벨이 더 있어도 된다. 한 번 만든 뒤에는 이 값을 바꿀 수 없다)
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      # Deployment가 만드는 Pod에 붙는 라벨
      #   name: 위 selector와 아래 Service의 selector가 이 값으로 Pod를 찾는다 (필수)
      labels:
        app.kubernetes.io/name: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            # conf.d에는 default.conf 하나만 둔다 (이미지에 든 기본 설정을 덮는다)
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: nginx-include
              mountPath: /etc/nginx/crewrun
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            items:
              - key: default.conf
                path: default.conf
        - name: nginx-include
          configMap:
            name: nginx-config
            items:
              - key: routes.conf
                path: routes.conf
              - key: upstreams.conf
                path: upstreams.conf
---
apiVersion: v1
kind: Service
metadata:
  name: bukang-nginx
  # Service 자체에 붙는 이름표. 설정에서 읽는 곳은 없다
  labels:
    app.kubernetes.io/name: nginx
spec:
  # 이 라벨이 붙은 Pod(위 Deployment의 template 라벨)로 요청을 보낸다
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
