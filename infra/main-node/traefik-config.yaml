# k3s에 기본으로 들어 있는 Traefik의 설정을 바꾼다 (HelmChartConfig: k3s가 Traefik Helm 차트에 덧붙이는 값)
#   install-k3s.sh가 ${ACME_EMAIL}·${ACME_CA_SERVER}를 채워 /var/lib/rancher/k3s/server/manifests/traefik-config.yaml로 둔다
#   k3s는 이 폴더의 파일을 알아서 적용하고, 바뀌면 Traefik을 다시 띄운다
#   이메일은 개인 정보라 저장소에 적지 않고 설치할 때 넘긴다
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # 접속자 IP를 그대로 남긴다. Cluster(기본)면 노드를 거치며 출발지가 바뀌어 nginx의 로그인 요청 제한이 모두를 한 사람으로 센다
    service:
      spec:
        externalTrafficPolicy: Local
    ports:
      # HTTP(80)로 온 요청은 HTTPS(443)로 옮긴다. Let's Encrypt 소유 확인(/.well-known/acme-challenge)은 Traefik이 먼저 처리한다
      # k3s v1.35의 Traefik 차트(39.x)는 ports.<이름>.http.redirections를 쓴다. http: 없이 쓰면 조용히 무시된다
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    # Let's Encrypt 인증서 발급·갱신. Ingress의 certresolver: letsencrypt가 이 이름을 쓴다
    certificatesResolvers:
      letsencrypt:
        acme:
          email: ${ACME_EMAIL}
          caServer: ${ACME_CA_SERVER}
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
    # 받은 인증서(acme.json)를 디스크에 남긴다. 없으면 Traefik이 다시 뜰 때마다 새로 받아 발급 횟수 제한(주 5회)에 걸린다
    persistence:
      enabled: true
      size: 128Mi
      path: /data
    # acme.json을 Traefik이 쓸 수 있게 볼륨 소유자를 맞춘다
    podSecurityContext:
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch
