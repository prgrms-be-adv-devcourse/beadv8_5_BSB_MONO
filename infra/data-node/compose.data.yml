# 보조 EC2(데이터 서버, 10.0.2.222)용 compose 덮어쓰기
#   backend/compose.yml의 인프라 정의(이미지·명령·상태 확인)를 그대로 쓰고, 서버에 필요한 것만 덮어쓴다
#   앱은 메인 EC2의 k3s에서 돌고, 이 서버의 포트로 접속한다 (k8s/overlays/aws의 Service가 이 서버 IP로 잇는다)
#
# 실행은 deploy.sh가 한다 (저장소 루트에서)
#   docker compose -f backend/compose.yml -f infra/data-node/compose.data.yml --env-file infra/data-node/.env \
#     up -d --wait bukang-db bukang-redis bukang-kafka bukang-elasticsearch redis-exporter mysqld-exporter node-exporter
# 관리 화면(Kafka Console, Elasticvue)은 띄우지 않는다. 이 서버는 외부에서 접속할 수 없고 메모리(3.7GB)가 작다
# 지표 exporter 3개(BUK-257)는 메인 k3s의 수집기가 15초마다 가져간다. exporter 하나에 20~30MB 정도 쓴다
#
# !override는 Docker Compose 2.24.4 이상에서 동작한다 (setup.sh가 설치하는 compose 플러그인은 이보다 새 버전이다)

# compose 프로젝트 이름. 폴더 이름과 상관없이 같은 컨테이너·네트워크를 쓴다
name: crewrun-data

services:
  bukang-db:
    restart: unless-stopped
    # 앱(메인 EC2)만 접속한다. 보안 그룹이 메인 EC2에서 오는 3306만 허용한다
    ports: !override
      - "${DATA_NODE_BIND_IP:?}:3306:3306"
    # compose.yml의 로컬용 계정(bukang2 등)을 운영 값으로 바꾼다. 처음 볼륨을 만들 때만 쓰인다
    # 앱 Secret(Parameter Store)의 MYSQL_USER·MYSQL_PASS와 같은 값이어야 한다
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - bukang-db-data:/var/lib/mysql

  bukang-redis:
    restart: unless-stopped
    ports: !override
      - "${DATA_NODE_BIND_IP:?}:6379:6379"
    volumes:
      - bukang-redis-data:/data

  # 앱은 internal 리스너(bukang-kafka:29092)로 접속하고, Redpanda도 이 주소를 알려 준다
  # 메인 k3s의 Service bukang-kafka가 이 서버의 29092로 이어 주므로 29092만 연다 (external 9092는 쓰지 않는다)
  # 9644는 Redpanda 관리 포트다. 지표 주소(/public_metrics)가 여기에 있어 exporter 없이 수집기가 바로 가져간다
  #   관리 API(설정 변경 등)도 같은 포트라, 보안 그룹에서 메인 EC2만 허용하는 것이 보호막이다
  bukang-kafka:
    restart: unless-stopped
    ports: !override
      - "${DATA_NODE_BIND_IP:?}:29092:29092"
      - "${DATA_NODE_BIND_IP:?}:9644:9644"
    volumes:
      - bukang-kafka-data:/var/lib/redpanda/data

  # 이미지(nori 플러그인)는 이 서버에서 backend/docker/elasticsearch로 빌드한다 (힙 512MB는 compose.yml 값 그대로)
  # 인덱스는 볼륨에 남겨, 다시 시작해도 대회 검색 문서를 처음부터 다시 만들지 않게 한다
  bukang-elasticsearch:
    restart: unless-stopped
    ports: !override
      - "${DATA_NODE_BIND_IP:?}:9200:9200"
    volumes:
      - bukang-es-data:/usr/share/elasticsearch/data

  # S3Mock은 띄우지 않는다. 운영은 실제 AWS S3를 쓴다 (운영 .env의 S3_ENDPOINT가 빈 값, 2026-11-15 확인)

  # ── 지표 exporter (BUK-257). 메인 k3s 수집기가 사설 IP로 가져간다 (k8s/overlays/aws/monitoring) ──
  # 수집기의 job 이름은 로컬 backend/docker/prometheus/prometheus.yml과 같게 둔다 (redis, redpanda 등)

  # Redis 지표 통역기. 정의(이미지·접속 주소)는 backend/compose.yml의 것을 그대로 쓰고 포트만 연다
  #   그쪽의 profiles: [monitoring]은 deploy.sh가 서비스 이름을 직접 적어 띄우므로 상관없다
  redis-exporter:
    restart: unless-stopped
    ports:
      - "${DATA_NODE_BIND_IP:?}:9121:9121"

  # MySQL 지표 통역기. 접속 수·쿼리 수·느린 쿼리·표별 읽기·쓰기를 9104로 연다
  #   전용 계정(exporter)은 exporter-user.sql로 한 번 만든다. 데이터는 읽지 못하고 상태 정보만 본다
  #   DB를 서비스별로 나눠도(BUK-238) 같은 MySQL 서버라 exporter는 하나면 된다. DB별 지표에는 schema 이름표가 붙는다
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    container_name: bukang-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=bukang-db:3306
      - --mysqld.username=exporter
    environment:
      # 비밀번호는 명령 인자 대신 환경 변수로 넘긴다 (docker inspect·ps에 덜 드러나게)
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?}
    ports:
      - "${DATA_NODE_BIND_IP:?}:9104:9104"
    depends_on:
      - bukang-db

  # 서버 지표(CPU·메모리·디스크·네트워크). 컨테이너가 아니라 서버 전체를 봐야 해서
  #   서버의 네트워크를 그대로 쓰고(network_mode: host) 서버 파일 시스템을 읽기 전용으로 붙인다
  #   host 네트워크라 ports 대신 듣는 주소를 사설 IP로 정한다
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: bukang-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=${DATA_NODE_BIND_IP:?}:9100
    volumes:
      - /:/host:ro,rslave

volumes:
  # name을 정해 두어 프로젝트 이름이 바뀌어도 같은 볼륨을 쓴다. down -v 를 하면 데이터가 모두 사라진다
  bukang-db-data:
    name: bukang-db-data
  bukang-redis-data:
    name: bukang-redis-data
  bukang-kafka-data:
    name: bukang-kafka-data
  bukang-es-data:
    name: bukang-es-data
