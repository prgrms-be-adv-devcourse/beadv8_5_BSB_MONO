name: ticket-run

# 이슈에 「팩토리 구현」 라벨이 붙으면 Claude가 그 티켓을 구현해 PR을 연다. 절차는 .claude/skills/ticket-run/SKILL.md의 「번호 있음」이다.
# 시크릿 CLAUDE_CODE_OAUTH_TOKEN이 없으면(시크릿을 아직 안 넣은 레포, 시크릿을 못 받는 포크) 아무것도 하지 않고 성공으로 끝난다.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 구현할 티켓 이슈 번호
        required: true
        type: string

# 같은 이슈에 라벨이 두 번 붙거나 수동 실행이 겹쳐도 하나만 돈다. 진행 중인 실행은 끊지 않는다.
concurrency:
  group: ticket-run-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

permissions: {}

jobs:
  implement:
    # 라벨 이벤트는 「팩토리 구현」일 때만 돈다. 수동 실행은 항상 돈다.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == '팩토리 구현'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - name: 시크릿 확인
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN 시크릿이 없어 구현을 건너뜁니다."
          fi

      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4

      # v1.0.290
      - if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugins: mattpocock-skills@claude-plugins-official
          claude_args: |
            --model sonnet
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(./gradlew:*),Bash(pnpm:*),Edit,Read,Write,Glob,Grep"
          prompt: |
            .claude/skills/ticket-run/SKILL.md를 Read하고 「번호 있음」 절차를 따라 이슈 #${{ env.ISSUE }} 하나를 구현하세요.
            이 실행에는 사람이 없으므로 경계 확인은 티켓의 「테스트 항목」으로 대신하고, 테스트 항목이 없으면 「구현 절차」 3번의 「번호 없음」 항목대로 라벨을 `구현 대기`로 바꾸고 이유를 이슈 댓글로 남기고 끝내세요.
            브랜치 이름은 `<종류>/<이슈 번호>-<영어 설명>` 형식이어야 합니다. `claude/`로 시작하는 이름은 쓰지 마세요.
            `--add-assignee @me`나 `--assignee @me`가 이 실행의 계정으로 실패하면 그 옵션만 빼고 계속하세요.
            저장소는 ${{ github.repository }}입니다.
