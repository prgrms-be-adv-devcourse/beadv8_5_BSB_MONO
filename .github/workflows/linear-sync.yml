name: linear-sync

# Linear 공식 GitHub 연동 대신 PR 이벤트로 이슈를 갱신한다.
# 저장소 Settings → Secrets and variables → Actions에 LINEAR_API_KEY가 있어야 한다.
on:
  pull_request:
    types: [opened, reopened, edited, closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          script: |
            const sync = require('./.github/scripts/linear-sync.js')
            await sync({ context, core })
