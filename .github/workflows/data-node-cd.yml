name: data-node-cd

# 보조 EC2(데이터 서버)의 인프라(MySQL·Redis·Redpanda·ES)를 바꾼다 (BUK-220)
# SSM으로 보조 EC2에 infra/data-node/deploy.sh를 실행시킨다. compose가 설정이 바뀐 서비스만 다시 만든다
# 운영 DB가 다시 시작될 수 있어 자동으로 돌지 않는다. 인프라 설정을 바꾼 PR이 main에 머지된 뒤 손으로 실행한다
#   Actions → data-node-cd → Run workflow (브랜치는 main)
#
# 저장소 Variables: AWS_DEPLOY_ROLE_ARN(배포 역할), DATA_INSTANCE_ID(보조 EC2). 만드는 법은 infra/README.md
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'main(최신) 또는 main에 들어간 커밋 SHA'
        required: true
        default: main

concurrency:
  group: data-node-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC 토큰을 받아 AWS 역할로 바꾼다
    steps:
      - uses: actions/checkout@v4

      # 입력값은 명령에 넣기 전에 형식을 확인한다 (명령 주입 방지). main에 들어간 커밋인지는 deploy.sh가 확인한다
      - name: 입력 확인
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REF" =~ ^(main|[0-9a-f]{7,40})$ ]]; then
            echo "::error::main 또는 커밋 SHA만 받습니다"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # ES 이미지를 서버에서 빌드하는 경우가 있어 15분
      - name: 보조 EC2에서 deploy.sh 실행
        env:
          INSTANCE_ID: ${{ vars.DATA_INSTANCE_ID }}
          REF: ${{ inputs.ref }}
        run: bash .github/scripts/ssm-run.sh "$INSTANCE_ID" 900 "bash /opt/crewrun/infra/data-node/deploy.sh $REF"
