name: pr-rules

# husky(commitlint)는 각자 PC의 커밋만 검사한다. 웹에서 만든 PR 제목과 브랜치 이름은 여기서 검사한다.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 이 job 이름(pr-title)이 main 브랜치 보호의 필수 체크다.
  pr-title:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 커밋과 같은 commitlint 설정(frontend/commitlint.config.mjs)으로 PR 제목을 검사한다.
      # 제목은 사용자 입력이라 스크립트에 직접 넣지 않고 환경 변수로 넘긴다.
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  # 이 job 이름(pr-branch)이 main 브랜치 보호의 필수 체크다.
  pr-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: |
            const check = require('./.github/scripts/pr-rules.js')
            await check({ context, core })

  # PR 본문이 템플릿(.github/pull_request_template.md)의 칸 규칙을 지키는지 보고, 중점 리뷰·논의 필요 라벨을 붙이거나 뗀다.
  # 본문을 고치면(edited) 다시 검사한다. 필수 체크는 아니다.
  # pull_request 이벤트라 포크 PR은 토큰이 읽기 전용이다. 이때는 라벨만 못 붙이고 검사 결과는 그대로 난다.
  pr-body:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: |
            const check = require('./.github/scripts/pr-body.js')
            await check({ github, context, core })

  # 수정한 파일 경로로 프론트·백엔드·인프라·문서 라벨을 붙인다(.github/labeler.yml).
  # 포크 PR은 토큰이 읽기 전용이라 실패할 수 있어 continue-on-error로 둔다.
  pr-labels:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6.0.1
        with:
          sync-labels: true
